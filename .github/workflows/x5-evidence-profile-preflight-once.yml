name: x5-evidence-profile-migration-once

on:
  push:
    branches:
      - codex/x5-evidence-profile
    paths:
      - .github/workflows/x5-evidence-profile-preflight-once.yml

permissions:
  contents: write

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/x5-evidence-profile
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply bounded X5 evidence profile migration
        run: python tools/ci/x5_evidence_profile_once.py
      - name: Complete regression test import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_project_readiness.py')
          text = path.read_text(encoding='utf-8')
          old = 'import json\nimport shutil\n\nfrom tools.codex_assets'
          new = 'import json\nimport shutil\n\nimport pytest\n\nfrom tools.codex_assets'
          if text.count(old) != 1:
              raise SystemExit('unexpected project readiness import preamble')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run profile and readiness regressions
        run: python -m pytest -q tests/test_evidence.py tests/test_project_readiness.py
      - name: Verify project readiness is idempotent
        run: bash tools/knowledge-project-readiness.sh --check --as-of 2026-07-13 --json
      - name: Run focused Ruff checks
        run: python -m ruff check tools/codex_assets/knowledge_hub/project_readiness.py tests/test_project_readiness.py
      - name: Commit bounded migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/projects.json \
                  registry/items.jsonl \
                  tools/codex_assets/knowledge_hub/project_readiness.py \
                  tests/test_project_readiness.py
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m 'Model X5 as embedded target evidence'
          git push origin HEAD:codex/x5-evidence-profile
