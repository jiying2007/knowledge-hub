name: aggregate-readiness-self-dependency-once

on:
  push:
    branches:
      - codex/aggregate-readiness-self-dependency
    paths:
      - .github/workflows/aggregate-readiness-self-dependency-once.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aggregate-readiness-self-dependency
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply bounded repair
        run: python tools/ci/aggregate_readiness_self_dependency_once.py
      - name: Run focused regression tests
        run: python -m pytest -q tests/test_evidence.py
      - name: Run focused Ruff checks
        run: python -m ruff check tools/codex_assets/knowledge_hub/evidence.py tools/codex_assets/knowledge_hub/product_gate_support.py tests/test_evidence.py
      - name: Commit bounded repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/codex_assets/knowledge_hub/evidence.py tools/codex_assets/knowledge_hub/product_gate_support.py tests/test_evidence.py
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "Fix aggregate readiness self-dependency"
          git push origin HEAD:codex/aggregate-readiness-self-dependency
