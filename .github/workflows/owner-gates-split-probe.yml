name: Owner Gates Split Migration

on:
  push:
    branches:
      - codex/legacy-burndown-owner-gates-v1
    paths:
      - .github/workflows/owner-gates-split-probe.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Bootstrap governed CI transport
        run: tools/ci/rtk bash tools/ci/bootstrap-path.sh
      - name: Install hash-locked dependencies
        run: rtk python3 -m pip install --require-hashes -r requirements-dev.lock
      - name: Split owner-gates and verify
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/owner-gates-baseline /tmp/owner-gates-after
          capture() {
            local out_dir="$1"
            rtk bash tools/knowledge-owner-gates.sh --status all --json > "$out_dir/all.json"
            rtk bash tools/knowledge-owner-gates.sh --summary > "$out_dir/summary.txt"
            rtk bash tools/knowledge-owner-gates.sh --forms-jsonl > "$out_dir/forms.jsonl"
            rtk bash tools/knowledge-owner-gates.sh --checklist --json > "$out_dir/checklist.json"
            rtk bash tools/knowledge-owner-gates.sh --evidence-readiness --json > "$out_dir/evidence.json"
            rtk bash tools/knowledge-owner-gates.sh --owner-inbox --json > "$out_dir/inbox.json"
            rtk bash tools/knowledge-owner-gates.sh --handoff-packet --json > "$out_dir/handoff.json"
            rtk bash tools/knowledge-owner-gates.sh --forms --json > "$out_dir/forms.json"
            rtk bash tools/knowledge-owner-gates.sh --next-open --json > "$out_dir/next-open.json"
            rtk python3 -m tools.codex_assets.knowledge_hub.owner_gates_cli . --status all --json > "$out_dir/module.json"
            cmp "$out_dir/all.json" "$out_dir/module.json"
          }
          capture /tmp/owner-gates-baseline

          rtk python3 - <<'PY'
          import ast
          import pathlib

          path = pathlib.Path('tools/codex_assets/knowledge_hub/owner_gates_cli.py')
          text = path.read_text(encoding='utf-8')
          tree = ast.parse(text)
          functions = {
              node.name: node
              for node in tree.body
              if isinstance(node, ast.FunctionDef)
          }

          groups = {
              'support': [
                  'load_jsonl','load_json','path_from_arg','_is_filled','source_path_values',
                  'source_path_matches','is_resolved','default_field_value','compute_source_identity',
                  '_row_ref','_display_path','user_path_prefixes','_read_jsonl_local','shlex_quote',
                  'is_filled','owner_route_for','source_execution_root','effective_verification_commands',
              ],
              'evidence': [
                  'inspect_owner_ready_item','owner_ready_items','owner_ready_state',
                  'owner_ready_evidence_refs','_is_evidence_field','_classify_evidence_command',
                  '_field_readiness','make_read_only_prefill_candidates','make_evidence_readiness',
                  'group_owner_required_fields','make_owner_inbox','make_owner_ready_coverage',
                  'make_owner_ready_blocking_context',
              ],
              'dispatch': [
                  '_safe_slug','make_owner_handoff_packet','make_owner_dispatch',
                  'make_owner_handoff_packets','make_owner_summary',
              ],
              'forms': [
                  'make_decision_form','make_owner_checklist','owner_ready_landing_errors',
                  'required_manual_files_for_forms','make_landing_plan','make_landing_audit',
              ],
          }
          extracted = {name for names in groups.values() for name in names}
          missing = sorted(extracted - functions.keys())
          if missing:
              raise SystemExit(f'missing expected functions: {missing}')

          def render(names):
              return '\n\n'.join(ast.unparse(functions[name]) for name in names) + '\n'

          support_header = '''import hashlib\nimport json\nimport os\nimport pathlib\n\nroot = pathlib.Path(".")\nerrors = []\nsource_roots = {}\nowner_route_map = {}\n\ndef configure_owner_gates_support(root_value, errors_value, *, source_roots_value=None, owner_route_map_value=None):\n    global root, errors, source_roots, owner_route_map\n    root = root_value\n    errors = errors_value\n    if source_roots_value is not None:\n        source_roots = source_roots_value\n    if owner_route_map_value is not None:\n        owner_route_map = owner_route_map_value\n\n'''
          evidence_header = '''import pathlib\n\nfrom .owner_gates_support import _display_path, _read_jsonl_local, _row_ref, shlex_quote, source_path_matches\n\nroot = pathlib.Path(".")\n\ndef configure_owner_gates_evidence(root_value):\n    global root\n    root = root_value\n\n'''
          forms_header = '''from .owner_gates_evidence import make_read_only_prefill_candidates, owner_ready_state\nfrom .owner_gates_support import default_field_value, is_filled\n\n'''
          dispatch_header = '''import json\n\nfrom .owner_gates_evidence import (\n    make_evidence_readiness,\n    make_owner_inbox,\n    make_owner_ready_blocking_context,\n    make_owner_ready_coverage,\n    owner_ready_state,\n)\nfrom .owner_gates_forms import make_decision_form, make_owner_checklist\nfrom .owner_gates_support import shlex_quote\n\n'''

          package = path.parent
          (package / 'owner_gates_support.py').write_text(support_header + render(groups['support']), encoding='utf-8')
          (package / 'owner_gates_evidence.py').write_text(evidence_header + render(groups['evidence']), encoding='utf-8')
          (package / 'owner_gates_forms.py').write_text(forms_header + render(groups['forms']), encoding='utf-8')
          (package / 'owner_gates_dispatch.py').write_text(dispatch_header + render(groups['dispatch']), encoding='utf-8')

          new_imports = ast.parse('''from .owner_gates_support import (\n    _display_path, compute_source_identity, configure_owner_gates_support,\n    effective_verification_commands, is_filled, is_resolved, load_json, load_jsonl,\n    owner_route_for, path_from_arg, source_path_matches, source_path_values,\n)\nfrom .owner_gates_evidence import (\n    configure_owner_gates_evidence, make_evidence_readiness, make_owner_inbox,\n    make_owner_ready_blocking_context, make_owner_ready_coverage, owner_ready_state,\n)\nfrom .owner_gates_forms import make_decision_form, make_landing_audit, make_landing_plan, make_owner_checklist\nfrom .owner_gates_dispatch import make_owner_dispatch, make_owner_handoff_packets, make_owner_summary\n''').body
          initial_config = ast.parse('''configure_owner_gates_support(root, errors)\nconfigure_owner_gates_evidence(root)\n''').body
          late_config = ast.parse('''configure_owner_gates_support(\n    root, errors, source_roots_value=source_roots, owner_route_map_value=owner_route_map\n)\n''').body

          body = []
          inserted_imports = False
          initial_done = False
          late_done = False
          for node in tree.body:
              if isinstance(node, ast.FunctionDef) and node.name in extracted:
                  continue
              if not inserted_imports and not isinstance(node, (ast.Import, ast.ImportFrom)):
                  body.extend(new_imports)
                  inserted_imports = True
              body.append(node)
              if (
                  not initial_done
                  and isinstance(node, ast.Assign)
                  and any(isinstance(target, ast.Name) and target.id == 'errors' for target in node.targets)
              ):
                  body.extend(initial_config)
                  initial_done = True
              if (
                  not late_done
                  and isinstance(node, ast.For)
                  and 'owner_routing_payload.get' in ast.unparse(node.iter)
              ):
                  body.extend(late_config)
                  late_done = True
          if not (inserted_imports and initial_done and late_done):
              raise SystemExit(f'injection failure imports={inserted_imports} initial={initial_done} late={late_done}')
          tree.body = body
          ast.fix_missing_locations(tree)
          path.write_text(ast.unparse(tree) + '\n', encoding='utf-8')
          PY

          rtk python3 -m ruff check --fix \
            tools/codex_assets/knowledge_hub/owner_gates_cli.py \
            tools/codex_assets/knowledge_hub/owner_gates_support.py \
            tools/codex_assets/knowledge_hub/owner_gates_evidence.py \
            tools/codex_assets/knowledge_hub/owner_gates_forms.py \
            tools/codex_assets/knowledge_hub/owner_gates_dispatch.py
          rtk python3 -m compileall -q tools/codex_assets/knowledge_hub/owner_gates_*.py

          capture /tmp/owner-gates-after
          for name in all.json summary.txt forms.jsonl checklist.json evidence.json inbox.json handoff.json forms.json next-open.json module.json; do
            cmp "/tmp/owner-gates-baseline/$name" "/tmp/owner-gates-after/$name"
          done

          rtk python3 -m pytest -q tests/test_cli_help.py tests/test_complexity_budget.py

          rtk python3 - <<'PY'
          import ast
          from pathlib import Path
          from tools.codex_assets.knowledge_hub.common import repository_root
          from tools.codex_assets.knowledge_hub.complexity_budget import evaluate_complexity_budget

          root = repository_root()
          paths = [
              Path('tools/codex_assets/knowledge_hub/owner_gates_cli.py'),
              Path('tools/codex_assets/knowledge_hub/owner_gates_support.py'),
              Path('tools/codex_assets/knowledge_hub/owner_gates_evidence.py'),
              Path('tools/codex_assets/knowledge_hub/owner_gates_forms.py'),
              Path('tools/codex_assets/knowledge_hub/owner_gates_dispatch.py'),
          ]
          for path in paths:
              lines = len(path.read_text(encoding='utf-8').splitlines())
              print(f'{path}={lines}')
              if lines > 800:
                  raise SystemExit(f'module exceeds 800 lines: {path}={lines}')
              if path.name != 'owner_gates_cli.py':
                  tree = ast.parse(path.read_text(encoding='utf-8'))
                  for node in ast.walk(tree):
                      if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                          size = (node.end_lineno or node.lineno) - node.lineno + 1
                          if size > 80:
                              raise SystemExit(f'new function exceeds 80 lines: {path}:{node.name}={size}')
          report = evaluate_complexity_budget(root)
          print(f'oversized_module_count={report["oversized_module_count"]}')
          print(f'oversized_paths={[row["path"] for row in report["oversized_modules"]]}')
          print(f'regressions={report["regressions"]}')
          if report['status'] != 'pass':
              raise SystemExit('complexity budget status is not pass')
          if report['oversized_module_count'] != 1:
              raise SystemExit(f'expected exactly 1 oversized module, got {report["oversized_module_count"]}')
          expected = ['tools/codex_assets/knowledge_hub/check_cli.py']
          actual = [row['path'] for row in report['oversized_modules']]
          if actual != expected:
              raise SystemExit(f'unexpected oversized paths: {actual}')
          if report['regressions']:
              raise SystemExit(f'unexpected complexity regressions: {report["regressions"]}')
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/codex_assets/knowledge_hub/owner_gates_cli.py \
            tools/codex_assets/knowledge_hub/owner_gates_support.py \
            tools/codex_assets/knowledge_hub/owner_gates_evidence.py \
            tools/codex_assets/knowledge_hub/owner_gates_forms.py \
            tools/codex_assets/knowledge_hub/owner_gates_dispatch.py
          git commit -m 'refactor(owner-gates): split review workflow domains'
          git push origin HEAD:codex/legacy-burndown-owner-gates-v1
