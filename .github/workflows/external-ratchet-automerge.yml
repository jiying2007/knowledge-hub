name: external-ratchet-automerge

on:
  workflow_run:
    workflows:
      - quality
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: external-ratchet-automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    name: Merge exact external evidence ratchet
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'pull_request' ||
         github.event.workflow_run.event == 'workflow_dispatch') &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'automation/external-gap-')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: read
    env:
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}

    steps:
      - name: Checkout trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.WORKFLOW_SHA }}
          persist-credentials: false

      - name: Set up governed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-runtime.lock

      - name: Bootstrap governed CI transport
        run: tools/ci/rtk bash tools/ci/bootstrap-path.sh

      - name: Install hash-locked runtime dependencies
        run: rtk python3 -m pip install --require-hashes -r requirements-runtime.lock

      - name: Resolve protected current master and exact PR
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cache=".cache/knowledge-hub/external-ratchet-automerge"
          mkdir -p "${cache}"

          if [[ ! "${HEAD_BRANCH}" =~ ^automation/external-gap-(connector-provider-pilot|production-retrieval-eval|memory-lifecycle-pilot|real-adoption-evidence)-[0-9a-f]{12}-[0-9]+$ ]]; then
            echo "external ratchet branch failed deterministic grammar" >&2
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TRIGGER_RUN_ID}" \
            > "${cache}/quality-run.json"
          gh api "repos/${GITHUB_REPOSITORY}" > "${cache}/repository.json"
          gh api "repos/${GITHUB_REPOSITORY}/branches/master" > "${cache}/master.json"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}" > "${cache}/head-commit.json"
          gh api \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=master&head=${GITHUB_REPOSITORY_OWNER}:${HEAD_BRANCH}&per_page=10" \
            > "${cache}/pulls.json"

          rtk python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          cache = Path(".cache/knowledge-hub/external-ratchet-automerge")
          run = json.loads((cache / "quality-run.json").read_text(encoding="utf-8"))
          repository = json.loads((cache / "repository.json").read_text(encoding="utf-8"))
          master = json.loads((cache / "master.json").read_text(encoding="utf-8"))
          head_commit = json.loads(
              (cache / "head-commit.json").read_text(encoding="utf-8")
          )
          pulls = json.loads((cache / "pulls.json").read_text(encoding="utf-8"))

          expected = {
              "id": int(os.environ["TRIGGER_RUN_ID"]),
              "name": "quality",
              "path": ".github/workflows/quality.yml",
              "status": "completed",
              "conclusion": "success",
              "head_branch": os.environ["HEAD_BRANCH"],
              "head_sha": os.environ["HEAD_SHA"],
          }
          for field, value in expected.items():
              if run.get(field) != value:
                  raise SystemExit(
                      "trigger Quality mismatch {} expected={!r} observed={!r}".format(
                          field, value, run.get(field)
                      )
                  )
          if run.get("event") not in {"pull_request", "workflow_dispatch"}:
              raise SystemExit("trigger Quality event is not trusted")
          if (run.get("head_repository") or {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("trigger Quality head repository mismatch")

          if repository.get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("live repository identity mismatch")
          if repository.get("private") is not True or repository.get("visibility") != "private":
              raise SystemExit("live repository must remain private")

          if master.get("protected") is not True:
              raise SystemExit("master must be protected before external ratchet auto-merge")
          master_sha = (master.get("commit") or {}).get("sha")
          if not isinstance(master_sha, str) or len(master_sha) != 40:
              raise SystemExit("current master SHA is unavailable")
          if os.environ["WORKFLOW_SHA"] != master_sha:
              raise SystemExit("trusted external auto-merge workflow is not current master")

          parents = head_commit.get("parents") or []
          if len(parents) != 1 or (parents[0] or {}).get("sha") != master_sha:
              raise SystemExit("external ratchet head must be direct child of current master")

          if not isinstance(pulls, list) or len(pulls) != 1:
              raise SystemExit("expected exactly one open external ratchet PR")
          pull = pulls[0]
          if pull.get("draft") is True:
              raise SystemExit("external ratchet PR must not be draft")
          if not str(pull.get("title", "")).startswith("chore(external): ratchet "):
              raise SystemExit("external ratchet PR title is invalid")
          if (pull.get("head") or {}).get("ref") != os.environ["HEAD_BRANCH"]:
              raise SystemExit("external ratchet PR head ref mismatch")
          if (pull.get("head") or {}).get("sha") != os.environ["HEAD_SHA"]:
              raise SystemExit("external ratchet PR head SHA mismatch")
          if ((pull.get("head") or {}).get("repo") or {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("external ratchet PR must be same-repository")
          if (pull.get("base") or {}).get("ref") != "master":
              raise SystemExit("external ratchet PR base must be master")
          if (pull.get("base") or {}).get("sha") != master_sha:
              raise SystemExit("external ratchet PR base SHA is stale")
          if int(pull.get("changed_files", 0) or 0) != 2:
              raise SystemExit("external ratchet PR must change exactly two files")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write("pr_number={}\n".format(int(pull["number"])))
              handle.write("master_sha={}\n".format(master_sha))
          PY

      - name: Fetch exact base and head canonical files
        id: origin
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          MASTER_SHA: ${{ steps.resolve.outputs.master_sha }}
        run: |
          set -euo pipefail
          cache=".cache/knowledge-hub/external-ratchet-automerge"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            > "${cache}/files.json"
          rtk python3 - <<'PY'
          import json
          from pathlib import Path

          rows = json.loads(
              Path(".cache/knowledge-hub/external-ratchet-automerge/files.json").read_text(
                  encoding="utf-8"
              )
          )
          observed = {
              str(row.get("filename", ""))
              for row in rows
              if isinstance(row, dict)
          }
          expected = {
              "registry/knowledge-platform-p5-p10.json",
              "registry/durable-evidence-ledger.jsonl",
          }
          if observed != expected:
              raise SystemExit(
                  "external ratchet PR changed paths outside allowlist: {}".format(
                      sorted(observed)
                  )
              )
          PY

          fetch_file() {
            local ref="$1"
            local path="$2"
            local output="$3"
            gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${ref}" --jq .content \
              | tr -d '\n' | base64 --decode > "${output}"
          }

          fetch_file "${MASTER_SHA}" registry/knowledge-platform-p5-p10.json "${cache}/base-registry.json"
          fetch_file "${HEAD_SHA}" registry/knowledge-platform-p5-p10.json "${cache}/head-registry.json"
          fetch_file "${MASTER_SHA}" registry/durable-evidence-ledger.jsonl "${cache}/base-ledger.jsonl"
          fetch_file "${HEAD_SHA}" registry/durable-evidence-ledger.jsonl "${cache}/head-ledger.jsonl"

          rtk python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          cache = Path(".cache/knowledge-hub/external-ratchet-automerge")
          base = (cache / "base-ledger.jsonl").read_bytes()
          head = (cache / "head-ledger.jsonl").read_bytes()
          if not head.startswith(base):
              raise SystemExit("durable ledger base prefix mismatch")
          tail = [line for line in head[len(base):].splitlines() if line.strip()]
          if len(tail) != 1:
              raise SystemExit("external ratchet PR must append one durable record")
          record = json.loads(tail[0].decode("utf-8"))
          match = re.fullmatch(
              r"external-evidence-"
              r"(connector-provider-pilot|production-retrieval-eval|memory-lifecycle-pilot|real-adoption-evidence)-"
              r"([0-9]+)-([0-9]+)",
              str(record.get("event_id", "")),
          )
          if match is None:
              raise SystemExit("external ratchet origin identity is invalid")
          gap, run_id, attempt = match.groups()
          expected_branch = "automation/external-gap-{}-{}-{}".format(
              gap, os.environ["MASTER_SHA"][:12], run_id
          )
          if os.environ["HEAD_BRANCH"] != expected_branch:
              raise SystemExit("external branch does not match trusted origin run")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write("gap={}\n".format(gap))
              handle.write("run_id={}\n".format(run_id))
              handle.write("run_attempt={}\n".format(attempt))
          PY

      - name: Download exact trusted ratchet artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN_RUN_ID: ${{ steps.origin.outputs.run_id }}
          ORIGIN_RUN_ATTEMPT: ${{ steps.origin.outputs.run_attempt }}
        run: |
          set -euo pipefail
          cache=".cache/knowledge-hub/external-ratchet-automerge"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${ORIGIN_RUN_ID}/attempts/${ORIGIN_RUN_ATTEMPT}" \
            > "${cache}/origin-run.json"
          artifact="knowledge-hub-external-ratchet-candidate-${ORIGIN_RUN_ID}-${ORIGIN_RUN_ATTEMPT}"
          mkdir -p "${cache}/origin-artifact"
          gh run download "${ORIGIN_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${artifact}" \
            --dir "${cache}/origin-artifact"

      - name: Verify exact external evidence ratchet
        id: verify
        env:
          MASTER_SHA: ${{ steps.resolve.outputs.master_sha }}
        run: |
          set -euo pipefail
          cache=".cache/knowledge-hub/external-ratchet-automerge"
          root="${cache}/origin-artifact"
          closure="$(find "${root}" -type f -name closure-candidate-receipt.json -print -quit)"
          intake="$(find "${root}" -type f -name intake-receipt.json -print -quit)"
          binding="$(find "${root}" -type f -name host-binding.json -print -quit)"
          proposal="$(find "${root}" -type f -name ratchet-proposal.json -print -quit)"
          test -n "${closure}"
          test -n "${intake}"
          test -n "${binding}"
          test -n "${proposal}"

          CLOSURE="${closure}" INTAKE="${intake}" BINDING="${binding}" PROPOSAL="${proposal}" \
          rtk python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          from tools.codex_assets.knowledge_hub.external_evidence_ratchet_verify import (
              verify_external_evidence_ratchet,
          )
          from tools.codex_assets.knowledge_hub.schemas import validate_instance

          cache = Path(".cache/knowledge-hub/external-ratchet-automerge")
          result = verify_external_evidence_ratchet(
              Path(".").resolve(),
              base_registry_path=cache / "base-registry.json",
              head_registry_path=cache / "head-registry.json",
              base_ledger_path=cache / "base-ledger.jsonl",
              head_ledger_path=cache / "head-ledger.jsonl",
              closure_receipt_path=Path(os.environ["CLOSURE"]),
              intake_receipt_path=Path(os.environ["INTAKE"]),
              host_binding_path=Path(os.environ["BINDING"]),
              proposal_path=Path(os.environ["PROPOSAL"]),
              origin_run_path=cache / "origin-run.json",
              repository=os.environ["GITHUB_REPOSITORY"],
              master_sha=os.environ["MASTER_SHA"],
              head_sha=os.environ["HEAD_SHA"],
          )
          contract = validate_instance(
              Path(".").resolve(),
              "external-evidence-ratchet-verification-v1",
              result,
          )
          if contract.get("status") != "pass":
              raise SystemExit(
                  "external ratchet verification contract failed: {}".format(
                      contract.get("errors", [])
                  )
              )
          (cache / "verification.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write("gap={}\n".format(result["gap_id"]))
              handle.write(
                  "candidate_sha={}\n".format(
                      result["candidate_registry_sha256"]
                  )
              )
          PY

      - name: Revalidate protected current master and merge exact head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          MASTER_SHA: ${{ steps.resolve.outputs.master_sha }}
          GAP: ${{ steps.verify.outputs.gap }}
          CANDIDATE_SHA: ${{ steps.verify.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          cache=".cache/knowledge-hub/external-ratchet-automerge"
          gh api "repos/${GITHUB_REPOSITORY}" > "${cache}/repository-before-merge.json"
          gh api "repos/${GITHUB_REPOSITORY}/branches/master" > "${cache}/master-before-merge.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${cache}/pull-before-merge.json"

          private="$(jq -r '.private == true and .visibility == "private"' "${cache}/repository-before-merge.json")"
          protected="$(jq -r '.protected == true' "${cache}/master-before-merge.json")"
          current_master="$(jq -r '.commit.sha' "${cache}/master-before-merge.json")"
          current_head="$(jq -r '.head.sha' "${cache}/pull-before-merge.json")"
          current_base="$(jq -r '.base.sha' "${cache}/pull-before-merge.json")"
          current_title="$(jq -r '.title' "${cache}/pull-before-merge.json")"
          expected_title="chore(external): ratchet ${GAP} ${CANDIDATE_SHA:0:12} @ ${MASTER_SHA:0:12}"

          if [[ "${private}" != "true" ]]; then
            echo "repository privacy regressed after external verification" >&2
            exit 1
          fi
          if [[ "${protected}" != "true" || "${current_master}" != "${MASTER_SHA}" ]]; then
            echo "master protection or source revision changed after external verification" >&2
            exit 1
          fi
          if [[ "${current_head}" != "${HEAD_SHA}" || "${current_base}" != "${MASTER_SHA}" ]]; then
            echo "external ratchet PR moved after verification" >&2
            exit 1
          fi
          if [[ "${current_title}" != "${expected_title}" ]]; then
            echo "external ratchet PR title no longer matches verified candidate" >&2
            exit 1
          fi

          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f sha="${HEAD_SHA}" \
            -f merge_method="squash" \
            > "${cache}/merge-result.json"
          test "$(jq -r '.merged == true' "${cache}/merge-result.json")" = "true"

      - name: Retire merged external ratchet branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "${HEAD_BRANCH}" =~ ^automation/external-gap-(connector-provider-pilot|production-retrieval-eval|memory-lifecycle-pilot|real-adoption-evidence)-[0-9a-f]{12}-[0-9]+$ ]]; then
            echo "merged external branch failed grammar" >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${HEAD_BRANCH}" >/dev/null 2>&1; then
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_BRANCH}"
          fi

      - name: Upload bounded external auto-merge proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knowledge-hub-external-ratchet-automerge-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/knowledge-hub/external-ratchet-automerge/*.json
          if-no-files-found: error
          retention-days: 90
