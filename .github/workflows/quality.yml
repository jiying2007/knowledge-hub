name: quality

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  system-runtime:
    name: System Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'push' && '["3.8","3.9"]' || '["3.8"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up representative system Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-runtime.lock
      - name: Bootstrap governed CI transport
        run: tools/ci/rtk bash tools/ci/bootstrap-path.sh
      - name: Install hash-locked runtime dependencies
        run: rtk python3 -m pip install --require-hashes -r requirements-runtime.lock
      - name: Verify public wrapper on system Python
        run: rtk bash tools/knowledge-check.sh --dry-run

  compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'push' && '["3.10","3.11","3.12","3.13","3.14"]' || '["3.10"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Bootstrap governed CI transport
        run: tools/ci/rtk bash tools/ci/bootstrap-path.sh
      - name: Install hash-locked dependencies
        run: rtk python3 -m pip install --require-hashes -r requirements-dev.lock
      - name: Run unit and integration tests
        run: rtk python3 -m pytest -q

  engineering:
    name: Engineering and supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Bootstrap governed CI transport
        run: tools/ci/rtk bash tools/ci/bootstrap-path.sh
      - name: Install hash-locked dependencies
        run: rtk python3 -m pip install --require-hashes -r requirements-dev.lock
      - name: Run full engineering gate
        run: rtk python3 -m tools.codex_assets.knowledge_hub.engineering_cli --mode full --json
      - name: Run deterministic compliance verdict matrix
        run: rtk bash tools/knowledge-compliance-eval.sh --root tests/fixtures/agent_compliance_root --cases tests/fixtures/agent_compliance_cases.jsonl --minimum-cases 50 --require-verdict-coverage --json
      - name: Verify remote checkout in an offsite runner
        run: rtk bash tools/knowledge-restore-drill.sh --source-mode head --json
      - name: Assess product readiness (non-terminal)
        run: rtk bash tools/knowledge-final-gate.sh --final-profile product --regression-suite full --reuse-engineering-evidence --summary-json
      - name: Verify required quality evidence
        if: always()
        run: rtk python3 -c 'from pathlib import Path; required=(".tmp/engineering/knowledge-hub.cdx.json",".cache/knowledge-hub/engineering-quality.json",".cache/knowledge-hub/restore-drill-head.json",".cache/knowledge-hub/final-gate-product-full.json"); missing=[path for path in required if not Path(path).is_file() or Path(path).stat().st_size == 0]; assert not missing, "missing-or-empty-quality-evidence={}".format(",".join(missing))'
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knowledge-hub-quality-evidence
          path: |
            .tmp/engineering/knowledge-hub.cdx.json
            .cache/knowledge-hub/engineering-quality.json
            .cache/knowledge-hub/restore-drill-head.json
            .cache/knowledge-hub/final-gate-product-full.json
          if-no-files-found: error
          retention-days: 30
