name: Product Gate Ruff Fix

on:
  push:
    branches:
      - codex/legacy-burndown-product-gate-v1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Remove proven unused import and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/codex_assets/knowledge_hub/product_gate.py')
          text = path.read_text(encoding='utf-8')
          old = 'import re\nimport sys\nimport time\n'
          if text.count(old) != 1:
              raise SystemExit('expected exact product_gate import block once')
          path.write_text(text.replace(old, 'import re\nimport time\n', 1), encoding='utf-8')
          Path('.github/workflows/product-gate-ruff-fix.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/product-gate-ruff-fix.yml' 'tools/codex_assets/knowledge_hub/product_gate.py' | sort)"
          if [ "$changed" != "$expected" ]; then
            printf 'unexpected changed paths:\n%s\n' "$changed" >&2
            exit 1
          fi
          git commit -m 'fix(product-gate): remove unused sys import'
          git push origin HEAD:codex/legacy-burndown-product-gate-v1
