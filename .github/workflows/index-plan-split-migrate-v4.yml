name: Index Plan Split Migration V4

on:
  push:
    branches:
      - codex/legacy-burndown-index-plan-v1

permissions:
  contents: write

jobs:
  migrate:
    if: "${{ !contains(github.event.head_commit.message, 'refactor(index-plan): split review and audit domains') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Bootstrap governed CI transport
        run: tools/ci/rtk bash tools/ci/bootstrap-path.sh
      - name: Install hash-locked dependencies
        run: rtk python3 -m pip install --require-hashes -r requirements-dev.lock
      - name: Capture baseline behavior
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/index-plan-before
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --json > /tmp/index-plan-before/all.json
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --summary-json > /tmp/index-plan-before/summary.json
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --section source --json > /tmp/index-plan-before/source.json
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --section manifest --json > /tmp/index-plan-before/manifest.json
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --section linking --json > /tmp/index-plan-before/linking.json
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --section review-queue --queue-limit 5 --json > /tmp/index-plan-before/review.json
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --section review-queue --queue-limit 5 --queue-forms-jsonl > /tmp/index-plan-before/forms.jsonl
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --section status > /tmp/index-plan-before/status.txt
      - name: Execute corrected deterministic split
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/index-plan-split-migrate.yml').read_text(encoding='utf-8')
          section = workflow.split('      - name: Split index plan domains\n', 1)[1]
          script = section.split("          python3 - <<'PY'\n", 1)[1].split('\n          PY\n', 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines()) + '\n'
          replacements = [
              ('from .index_plan_review_queue import build_review_queue_command\\n\\nSHA256_RE', 'from .index_plan_review_queue import as_list, build_review_queue_command\\n\\nSHA256_RE'),
              ('    as_list,\\n    build_review_queue_view,', '    build_review_queue_view,'),
              ("'def build_linking_audit(root, warnings, by_project, by_source, by_topic, decisions, by_decision, items, sources, topics):'", "'def build_linking_audit(root, warnings, by_project, by_source, by_topic, decisions, by_decision, items, sources, topics, projects):'"),
              ("'linking_audit = build_linking_audit(root, warnings, by_project, by_source, by_topic, decisions, by_decision, items, sources, topics)'", "'linking_audit = build_linking_audit(root, warnings, by_project, by_source, by_topic, decisions, by_decision, items, sources, topics, projects)'"),
          ]
          for old, new in replacements:
              if script.count(old) != 1:
                  raise SystemExit(f'expected one embedded fragment, got {script.count(old)}: {old}')
              script = script.replace(old, new, 1)
          exec(compile(script, '<index-plan-split-migration>', 'exec'), {})
          PY
      - name: Restore explicit typing after module split
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one fragment, found {text.count(old)}: {old!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_line_once(path, old, new):
              lines = path.read_text(encoding='utf-8').splitlines()
              hits = [i for i, line in enumerate(lines) if line == old]
              if len(hits) != 1:
                  raise SystemExit(f'{path}: expected one exact line, found {len(hits)}: {old!r}')
              lines[hits[0]] = new
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          main = Path('tools/codex_assets/knowledge_hub/index_plan_cli.py')
          replace_once(main, 'import sys\n\nfrom .index_plan_linking', 'import sys\nfrom typing import Any, Dict, List\n\nfrom .index_plan_linking')
          typed_main = [
              ('by_project = {}', 'by_project: Dict[str, Dict[str, Any]] = {}'),
              ('by_source = {}', 'by_source: Dict[str, Dict[str, Any]] = {}'),
              ('by_topic = {}', 'by_topic: Dict[str, Dict[str, Any]] = {}'),
              ('by_decision = {', 'by_decision: Dict[str, List[Dict[str, Any]]] = {'),
              ('by_manifest = {', 'by_manifest: Dict[str, Any] = {'),
              ('by_review_queue = {', 'by_review_queue: Dict[str, Any] = {'),
              ('coverage_by_source = {}', 'coverage_by_source: Dict[str, Dict[str, Any]] = {}'),
              ('manifest_profile_health_counts = {}', 'manifest_profile_health_counts: Dict[str, int] = {}'),
          ]
          for old, new in typed_main:
              replace_line_once(main, old, new)

          queue = Path('tools/codex_assets/knowledge_hub/index_plan_review_queue.py')
          replace_once(queue, 'import pathlib\n\nREVIEW_CONTENT_BOUND_DECISIONS', 'import pathlib\nfrom typing import Counter\n\nREVIEW_CONTENT_BOUND_DECISIONS')
          replace_line_once(queue, '    priority_counts = collections.Counter()', '    priority_counts: Counter[str] = collections.Counter()')

          forms = Path('tools/codex_assets/knowledge_hub/index_plan_review_forms.py')
          replace_once(forms, 'import re\n\nfrom .index_plan_review_queue', 'import re\nfrom typing import Counter\n\nfrom .index_plan_review_queue')
          replace_line_once(forms, '    sla_counts = collections.Counter()', '    sla_counts: Counter[str] = collections.Counter()')
          replace_line_once(forms, '    by_domain = collections.Counter()', '    by_domain: Counter[str] = collections.Counter()')
          PY
          rtk python3 -m compileall -q tools/codex_assets/knowledge_hub/index_plan_*.py
          rtk python3 -m ruff check tools/codex_assets/knowledge_hub/index_plan_cli.py tools/codex_assets/knowledge_hub/index_plan_support.py tools/codex_assets/knowledge_hub/index_plan_review_queue.py tools/codex_assets/knowledge_hub/index_plan_review_forms.py tools/codex_assets/knowledge_hub/index_plan_manifest.py tools/codex_assets/knowledge_hub/index_plan_linking.py
          rtk python3 -m mypy tools/codex_assets/knowledge_hub/index_plan_cli.py tools/codex_assets/knowledge_hub/index_plan_support.py tools/codex_assets/knowledge_hub/index_plan_review_queue.py tools/codex_assets/knowledge_hub/index_plan_review_forms.py tools/codex_assets/knowledge_hub/index_plan_manifest.py tools/codex_assets/knowledge_hub/index_plan_linking.py
      - name: Verify behavioral identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/index-plan-after
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --json > /tmp/index-plan-after/all.json
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --summary-json > /tmp/index-plan-after/summary.json
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --section source --json > /tmp/index-plan-after/source.json
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --section manifest --json > /tmp/index-plan-after/manifest.json
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --section linking --json > /tmp/index-plan-after/linking.json
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --section review-queue --queue-limit 5 --json > /tmp/index-plan-after/review.json
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --section review-queue --queue-limit 5 --queue-forms-jsonl > /tmp/index-plan-after/forms.jsonl
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --section status > /tmp/index-plan-after/status.txt
          for name in all.json summary.json source.json manifest.json linking.json review.json forms.jsonl status.txt; do
            cmp "/tmp/index-plan-before/$name" "/tmp/index-plan-after/$name"
          done
      - name: Commit candidate and verify tracked complexity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/codex_assets/knowledge_hub/index_plan_cli.py \
            tools/codex_assets/knowledge_hub/index_plan_support.py \
            tools/codex_assets/knowledge_hub/index_plan_review_queue.py \
            tools/codex_assets/knowledge_hub/index_plan_review_forms.py \
            tools/codex_assets/knowledge_hub/index_plan_manifest.py \
            tools/codex_assets/knowledge_hub/index_plan_linking.py
          git commit -m 'refactor(index-plan): split review and audit domains'
          rtk python3 - <<'PY'
          from tools.codex_assets.knowledge_hub.common import repository_root
          from tools.codex_assets.knowledge_hub.complexity_budget import evaluate_complexity_budget

          root = repository_root()
          paths = [
              'tools/codex_assets/knowledge_hub/index_plan_cli.py',
              'tools/codex_assets/knowledge_hub/index_plan_support.py',
              'tools/codex_assets/knowledge_hub/index_plan_review_queue.py',
              'tools/codex_assets/knowledge_hub/index_plan_review_forms.py',
              'tools/codex_assets/knowledge_hub/index_plan_manifest.py',
              'tools/codex_assets/knowledge_hub/index_plan_linking.py',
          ]
          for rel in paths:
              count = len((root / rel).read_text(encoding='utf-8').splitlines())
              print(f'{rel}: {count}')
              if count > 800:
                  raise SystemExit(f'{rel} exceeds 800 lines')
          report = evaluate_complexity_budget(root)
          print(f'oversized_module_count={report["oversized_module_count"]}')
          print(f'regressions={report["regressions"]}')
          if report['status'] != 'pass':
              raise SystemExit('complexity budget failed')
          if report['oversized_module_count'] != 2:
              raise SystemExit(f'expected oversized count 2, got {report["oversized_module_count"]}')
          PY
          rtk python3 -m pytest -q tests/test_complexity_budget.py tests/test_cli_help.py
          git push origin HEAD:codex/legacy-burndown-index-plan-v1
