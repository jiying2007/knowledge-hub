name: Product source reachability fix once

on:
  push:
    branches:
      - codex/product-source-reachability

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot source readiness fixer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/product-source-reachability

      - name: Patch hosted product source semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          support = Path('tools/codex_assets/knowledge_hub/product_gate_support.py')
          text = support.read_text(encoding='utf-8')

          marker = '''def _unit_test_evidence_reuse_mode(\n'''
          helper = '''def _canonical_source_mapping_ready(\n    contract_evaluation: Mapping[str, Any],\n) -> bool:\n    """Report canonical source evidence independently from host-local workspaces."""\n    if contract_evaluation.get("profile") == "aggregate-group":\n        return True\n    required = set(contract_evaluation.get("required_fields", []))\n    missing = set(contract_evaluation.get("missing_fields", []))\n    invalid = set(contract_evaluation.get("invalid_fields", []))\n    return bool(\n        "source_refs" in required\n        and "source_refs" not in missing\n        and "source_refs" not in invalid\n    )\n\n\n'''
          assert text.count(marker) == 1
          text = text.replace(marker, helper + marker, 1)

          old = '''    structural_ready = 0\n    source_mapped = 0\n    decision_owner_ready = 0\n'''
          new = '''    structural_ready = 0\n    source_mapped = 0\n    local_workspace_ready = 0\n    decision_owner_ready = 0\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        repos = _repo_rows_for_project(project, repositories)\n        workspace_state = _workspace_state(repos, local_workspaces)\n        mapped = workspace_state in {"all-mapped-and-present", "not-applicable-group-or-control-plane"}\n        source_mapped += int(mapped)\n        validation_item = slot_items["validation"]\n        contract_evaluation = evaluate_evidence_contract(\n            validation_item.get("evidence_contract", {})\n        )\n'''
          new = '''        repos = _repo_rows_for_project(project, repositories)\n        workspace_state = _workspace_state(repos, local_workspaces)\n        local_workspace_mapped = workspace_state in {\n            "all-mapped-and-present",\n            "not-applicable-group-or-control-plane",\n        }\n        local_workspace_ready += int(local_workspace_mapped)\n        validation_item = slot_items["validation"]\n        contract_evaluation = evaluate_evidence_contract(\n            validation_item.get("evidence_contract", {})\n        )\n        source_mapping_ready = _canonical_source_mapping_ready(contract_evaluation)\n        source_mapped += int(source_mapping_ready)\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        evidence = (\n            structural\n            and mapped\n            and contract_evaluation["status"] == "ready"\n            and contract_evaluation["profile"] != "aggregate-group"\n        )\n'''
          new = '''        evidence = (\n            structural\n            and source_mapping_ready\n            and contract_evaluation["status"] == "ready"\n            and contract_evaluation["profile"] != "aggregate-group"\n        )\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''                "workspace_state": workspace_state,\n                "source_mapping_ready": mapped,\n                "evidence_profile": contract_evaluation["profile"],\n'''
          new = '''                "workspace_state": workspace_state,\n                "local_workspace_ready": local_workspace_mapped,\n                "source_mapping_ready": source_mapping_ready,\n                "evidence_profile": contract_evaluation["profile"],\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        "source_mapping_ready_count": source_mapped,\n        "decision_owner_ready_count": decision_owner_ready,\n'''
          new = '''        "source_mapping_ready_count": source_mapped,\n        "local_workspace_ready_count": local_workspace_ready,\n        "decision_owner_ready_count": decision_owner_ready,\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          support.write_text(text, encoding='utf-8')

          test = Path('tests/test_product_gate.py')
          text = test.read_text(encoding='utf-8')
          marker = '''from tools.codex_assets.knowledge_hub.product_gate import _candidate_integrity\n'''
          addition = '''from tools.codex_assets.knowledge_hub.product_gate_support import (\n    _canonical_source_mapping_ready,\n)\n'''
          assert text.count(marker) == 1
          text = text.replace(marker, marker + addition, 1)

          old = '''    assert "source_mapping_ready_count" in payload\n    assert payload["route_matrix_failure_count"] == 0\n'''
          new = '''    assert "source_mapping_ready_count" in payload\n    assert "local_workspace_ready_count" in payload\n    assert 0 <= payload["local_workspace_ready_count"] <= payload["project_count"]\n    assert 0 <= payload["source_mapping_ready_count"] <= payload["project_count"]\n    assert all("local_workspace_ready" in row for row in payload["rows"])\n    assert payload["route_matrix_failure_count"] == 0\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          marker = '''\n\ndef test_product_is_the_only_executable_final_profile():\n'''
          new_test = '''\n\ndef test_canonical_source_mapping_is_independent_from_local_workspace_presence():\n    ready = {\n        "profile": "software-tool",\n        "required_fields": ["owner_ref", "source_refs", "validation_refs"],\n        "missing_fields": [],\n        "invalid_fields": [],\n    }\n    missing = {**ready, "missing_fields": ["source_refs"]}\n    invalid = {**ready, "invalid_fields": ["source_refs"]}\n    aggregate = {\n        "profile": "aggregate-group",\n        "required_fields": ["owner_ref", "member_project_ids"],\n        "missing_fields": [],\n        "invalid_fields": [],\n    }\n\n    assert _canonical_source_mapping_ready(ready) is True\n    assert _canonical_source_mapping_ready(missing) is False\n    assert _canonical_source_mapping_ready(invalid) is False\n    assert _canonical_source_mapping_ready(aggregate) is True\n'''
          assert text.count(marker) == 1
          text = text.replace(marker, new_test + marker, 1)
          test.write_text(text, encoding='utf-8')
          PY

          python3 -m py_compile \
            tools/codex_assets/knowledge_hub/product_gate_support.py \
            tests/test_product_gate.py
          git diff --check
          git diff -- tools/codex_assets/knowledge_hub/product_gate_support.py tests/test_product_gate.py

      - name: Commit source readiness semantic fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/codex_assets/knowledge_hub/product_gate_support.py tests/test_product_gate.py
          git diff --cached --quiet && { echo 'expected patch missing'; exit 1; }
          git commit -m 'Decouple source evidence from local workspaces'
          git push origin HEAD:codex/product-source-reachability
