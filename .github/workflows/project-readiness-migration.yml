name: project-readiness-migration

on:
  push:
    branches:
      - arch/runtime-consumer-route-v2
    paths:
      - .github/workflows/project-readiness-migration.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Bootstrap governed CI transport
        run: tools/ci/rtk bash tools/ci/bootstrap-path.sh
      - name: Install hash-locked dependencies
        run: rtk python3 -m pip install --require-hashes -r requirements-dev.lock
      - name: Materialize canonical project readiness
        run: rtk bash tools/knowledge-project-readiness.sh --apply --as-of 2026-07-13 --json
      - name: Verify bounded generated diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^...//' | sort)
          printf '%s\n' "${changed[@]}"
          test ${#changed[@]} -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              README.md|indexes/*|registry/items.jsonl|registry/lifecycle-events.jsonl|projects/digital-worker/README.md|projects/digital-worker/validation/project-readiness.md)
                ;;
              *)
                echo "unexpected generated path: $path" >&2
                exit 1
                ;;
            esac
          done
          test -f projects/digital-worker/validation/project-readiness.md
          grep -q 'digital-worker-readiness-validation-20260713' registry/items.jsonl
      - name: Prove generator is now idempotent
        run: rtk bash tools/knowledge-project-readiness.sh --check --as-of 2026-07-13 --json
      - name: Commit generated readiness state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md indexes registry/items.jsonl registry/lifecycle-events.jsonl projects/digital-worker/README.md projects/digital-worker/validation/project-readiness.md
          git commit -m 'feat(registry): materialize digital-worker readiness evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
