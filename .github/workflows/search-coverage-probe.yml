name: Search Coverage Probe

on:
  push:
    branches:
      - codex/legacy-burndown-search-v1

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Bootstrap governed CI transport
        run: tools/ci/rtk bash tools/ci/bootstrap-path.sh
      - name: Apply Ruff fix and measure pytest coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/codex_assets/knowledge_hub/search.py')
          text = path.read_text(encoding='utf-8')
          old = 'setattr(_sys.modules[__name__], "__class__", _SearchFacadeModule)\n'
          new = '_sys.modules[__name__].__class__ = _SearchFacadeModule\n'
          if text.count(old) != 1:
              raise SystemExit('expected exact search facade class assignment once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rtk python3 -m pip install --require-hashes -r requirements-dev.lock
          rtk python3 -m coverage erase
          rtk python3 -m coverage run --parallel-mode -m pytest -q
          rtk python3 -m coverage combine
          rtk python3 -m coverage report --fail-under=0
          rtk python3 -m ruff check tools/codex_assets/knowledge_hub/search.py tests/test_search_split_surface.py
          python3 - <<'PY'
          from pathlib import Path
          Path('.github/workflows/search-coverage-probe.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(search): use direct module class assignment'
          git push origin HEAD:codex/legacy-burndown-search-v1
