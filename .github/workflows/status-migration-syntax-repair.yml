name: Status Split Hosted Migration

on:
  push:
    branches:
      - codex/legacy-burndown-status-v1

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.14'
      - name: Bootstrap governed CI transport
        run: tools/ci/rtk bash tools/ci/bootstrap-path.sh
      - name: Install locked dependencies
        run: rtk python3 -m pip install --require-hashes -r requirements-dev.lock
      - name: Capture baseline status contracts
        run: |
          set -euo pipefail
          rtk bash tools/knowledge-status.sh --as-of 2026-09-13 --json > /tmp/status-before.json
          rtk bash tools/knowledge-status.sh --as-of 2026-09-13 > /tmp/status-before.txt
      - name: Apply dashboard split from retained migration recipe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/status-split-migrate.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index('\n          PY', start)
          raw = workflow[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines())
          exec(compile(script, 'status-split-migration.py', 'exec'), {'__name__': '__main__'})
          PY
      - name: Repair migration boundary and split-module lint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cli = Path('tools/codex_assets/knowledge_hub/status_cli.py')
          text = cli.read_text(encoding='utf-8')
          old_import = 'from .status_common import load_json, load_jsonl, parse_date, run_json, shell_command\n'
          new_import = '''from .status_common import (\n    load_json,\n    load_jsonl,\n    parse_date,\n    resolve_today,\n    run_json,\n    shell_command,\n)\n'''
          if old_import not in text:
              raise SystemExit('status_common import anchor missing after migration')
          text = text.replace(old_import, new_import, 1)
          anchor = 'if args.review_queue_limit < 1:\n    parser.error("--review-queue-limit must be a positive integer")\n\nerrors = []\n'
          replacement = 'if args.review_queue_limit < 1:\n    parser.error("--review-queue-limit must be a positive integer")\n\ntoday, today_source = resolve_today(args, parser)\n\nerrors = []\n'
          if anchor not in text:
              raise SystemExit('today restoration anchor missing after migration')
          cli.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

          owner = Path('tools/codex_assets/knowledge_hub/status_owner_projection.py')
          text = owner.read_text(encoding='utf-8')
          replacements = {
              '    source_id = str(row.get("source_id", "")); worksheet_id = str(row.get("id", ""))\n': '    source_id = str(row.get("source_id", ""))\n    worksheet_id = str(row.get("id", ""))\n',
              '    routes: List[Dict[str, Any]] = []; seen = set()\n': '    routes: List[Dict[str, Any]] = []\n    seen = set()\n',
              '            seen.add(key); routes.append(route)\n': '            seen.add(key)\n            routes.append(route)\n',
              '    source_id = str(first.get("source_id", "")); worksheet_id = str(first.get("id", ""))\n': '    source_id = str(first.get("source_id", ""))\n    worksheet_id = str(first.get("id", ""))\n',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('owner projection lint anchor missing: {}'.format(old.strip()))
              text = text.replace(old, new, 1)
          owner.write_text(text, encoding='utf-8')

          review = Path('tools/codex_assets/knowledge_hub/status_review.py')
          text = review.read_text(encoding='utf-8')
          old = '    key = lambda row: (str(row.get("priority", "P9")), str(row.get("review_after", "") or "9999-12-31"), str(row.get("owner", "")), str(row.get("id", "")))\n'
          new = '''    def key(row: Dict[str, Any]) -> Any:\n        return (\n            str(row.get("priority", "P9")),\n            str(row.get("review_after", "") or "9999-12-31"),\n            str(row.get("owner", "")),\n            str(row.get("id", "")),\n        )\n'''
          if old not in text:
              raise SystemExit('review sort-key lint anchor missing')
          review.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate Python compilation
        run: python3 -m compileall -q tools/codex_assets/knowledge_hub/status_*.py
      - name: Validate Ruff
        run: rtk python3 -m ruff check tools/codex_assets/knowledge_hub/status_*.py tests/test_complexity_budget.py
      - name: Validate mypy
        run: rtk python3 -m mypy
      - name: Validate status behavioral identity
        shell: bash
        run: |
          set -euo pipefail
          rtk bash tools/knowledge-status.sh --as-of 2026-09-13 --json > /tmp/status-after.json
          rtk bash tools/knowledge-status.sh --as-of 2026-09-13 > /tmp/status-after.txt
          python3 - <<'PY'
          import json
          from pathlib import Path

          def normalize(value):
              if isinstance(value, dict):
                  return {k: normalize(v) for k, v in value.items() if k != 'generated_at'}
              if isinstance(value, list):
                  return [normalize(v) for v in value]
              return value

          before = normalize(json.loads(Path('/tmp/status-before.json').read_text()))
          after = normalize(json.loads(Path('/tmp/status-after.json').read_text()))
          if before != after:
              raise SystemExit('normalized status JSON changed during split')
          if Path('/tmp/status-before.txt').read_text() != Path('/tmp/status-after.txt').read_text():
              raise SystemExit('status text output changed during split')
          PY
      - name: Validate status structural budgets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path

          for path in [
              Path('tools/codex_assets/knowledge_hub/status_cli.py'),
              Path('tools/codex_assets/knowledge_hub/status_common.py'),
              Path('tools/codex_assets/knowledge_hub/status_owner_projection.py'),
              Path('tools/codex_assets/knowledge_hub/status_product_audit.py'),
              Path('tools/codex_assets/knowledge_hub/status_result.py'),
              Path('tools/codex_assets/knowledge_hub/status_review.py'),
          ]:
              source = path.read_text(encoding='utf-8')
              lines = len(source.splitlines())
              print(f'{path}: {lines} lines')
              if lines > 800:
                  raise SystemExit(f'{path} exceeds 800 lines')
              tree = ast.parse(source)
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      span = node.end_lineno - node.lineno + 1
                      if span > 80:
                          raise SystemExit(f'{path}:{node.name} exceeds 80 lines ({span})')
          PY
      - name: Validate focused tests and diff
        run: |
          set -euo pipefail
          rtk python3 -m pytest -q tests/test_complexity_budget.py tests/test_cli_help.py
          git diff --check
      - name: Commit migrated product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/codex_assets/knowledge_hub/status_*.py pyproject.toml tests/test_complexity_budget.py
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'refactor(status): split dashboard projections'
          git push origin HEAD:codex/legacy-burndown-status-v1
