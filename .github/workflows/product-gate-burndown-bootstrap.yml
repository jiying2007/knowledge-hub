name: Product Gate Burn-down Bootstrap

on:
  push:
    branches:
      - codex/legacy-burndown-product-gate-v1

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Split product gate without changing its public facade
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/product_gate_burndown_bootstrap.py
          python3 -c 'from pathlib import Path; [(p.write_text(p.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")) for p in (Path("tests/test_complexity_budget.py"), Path("tests/test_product_gate.py"))]'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(product-gate): split support and parallel collection'
          git push origin HEAD:codex/legacy-burndown-product-gate-v1
