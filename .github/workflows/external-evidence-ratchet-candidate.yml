name: external-evidence-ratchet-candidate

on:
  workflow_run:
    workflows:
      - external-evidence-intake
    types:
      - completed
  workflow_dispatch:
    inputs:
      intake_run_id:
        description: Successful external-evidence-intake workflow run id
        required: true
        type: string
      artifact_name:
        description: Exact bounded intake artifact name
        required: true
        type: string
  pull_request:
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: external-evidence-ratchet-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Build governed external evidence ratchet
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'master')
      }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_REVISION: ${{ github.workflow_sha }}

    steps:
      - name: Checkout trusted ratchet builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false

      - name: Set up governed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-runtime.lock

      - name: Bootstrap governed CI transport
        run: tools/ci/rtk bash tools/ci/bootstrap-path.sh

      - name: Install hash-locked runtime dependencies
        run: rtk python3 -m pip install --require-hashes -r requirements-runtime.lock

      - name: Resolve and verify intake artifact
        id: intake
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          AUTO_INTAKE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
          MANUAL_INTAKE_RUN_ID: ${{ inputs.intake_run_id }}
          MANUAL_ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          cache=".cache/knowledge-hub/external-ratchet"
          mkdir -p "${cache}"

          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            intake_run_id="${AUTO_INTAKE_RUN_ID}"
          else
            intake_run_id="${MANUAL_INTAKE_RUN_ID}"
          fi
          [[ "${intake_run_id}" =~ ^[0-9]+$ ]] || {
            echo "intake_run_id must be numeric" >&2
            exit 2
          }

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${intake_run_id}" \
            > "${cache}/intake-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${intake_run_id}/artifacts?per_page=100" \
            > "${cache}/intake-artifacts.json"

          INTAKE_RUN_ID="${intake_run_id}" rtk python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          cache = Path(".cache/knowledge-hub/external-ratchet")
          run = json.loads((cache / "intake-run.json").read_text(encoding="utf-8"))
          artifacts = json.loads(
              (cache / "intake-artifacts.json").read_text(encoding="utf-8")
          )
          repository = os.environ["GITHUB_REPOSITORY"]
          event_name = os.environ["EVENT_NAME"]
          run_id = int(os.environ["INTAKE_RUN_ID"])

          if run.get("id") != run_id:
              raise SystemExit("intake workflow run identity mismatch")
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit("intake workflow run must be completed/success")
          if (run.get("repository") or {}).get("full_name") != repository:
              raise SystemExit("intake workflow run must belong to the current repository")
          if run.get("path") != ".github/workflows/external-evidence-intake.yml":
              raise SystemExit("source run must be external-evidence-intake")
          if run.get("head_branch") != "master":
              raise SystemExit("intake workflow run must execute from master")
          head_sha = str(run.get("head_sha") or "").lower()
          if not re.fullmatch(r"[0-9a-f]{40}", head_sha):
              raise SystemExit("intake workflow run must expose an exact revision")

          rows = [
              row
              for row in artifacts.get("artifacts", [])
              if isinstance(row, dict) and row.get("expired") is not True
          ]
          pattern = re.compile(
              r"^knowledge-hub-external-evidence-"
              r"(connector-provider-pilot|production-retrieval-eval|memory-lifecycle-pilot|real-adoption-evidence)-"
              + str(run_id)
              + r"-"
              + str(int(run.get("run_attempt", 0) or 0))
              + r"$"
          )
          if event_name == "workflow_run":
              matches = [
                  row
                  for row in rows
                  if pattern.fullmatch(str(row.get("name") or ""))
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      "automatic ratchet requires exactly one bounded intake artifact"
                  )
              artifact = matches[0]
          else:
              wanted = os.environ["MANUAL_ARTIFACT_NAME"]
              if not re.fullmatch(
                  r"knowledge-hub-external-evidence-[A-Za-z0-9._-]+", wanted
              ):
                  raise SystemExit(
                      "artifact_name must identify a bounded external evidence artifact"
                  )
              matches = [row for row in rows if row.get("name") == wanted]
              if len(matches) != 1:
                  raise SystemExit("expected exactly one bounded intake artifact")
              artifact = matches[0]

          name = str(artifact["name"])
          match = pattern.fullmatch(name)
          if match is None:
              raise SystemExit("intake artifact identity does not match run/attempt")
          gap = match.group(1)
          digest = str(artifact.get("digest") or "")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("intake artifact must expose a sha256 digest")

          binding = {
              "schema_version": 1,
              "projection": "knowledge-hub-external-evidence-intake-host-binding-v1",
              "status": "pass",
              "repository": repository,
              "workflow_path": str(run["path"]),
              "intake_run_id": run_id,
              "intake_run_attempt": int(run["run_attempt"]),
              "intake_run_head_sha": head_sha,
              "artifact_id": int(artifact["id"]),
              "artifact_name": name,
              "artifact_digest": digest,
          }
          (cache / "host-binding-pre.json").write_text(
              json.dumps(binding, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write("run_id={}\n".format(run_id))
              handle.write("run_attempt={}\n".format(int(run["run_attempt"])))
              handle.write("artifact_name={}\n".format(name))
              handle.write("gap={}\n".format(gap))
          PY

      - name: Download exact bounded intake artifact
        env:
          GH_TOKEN: ${{ github.token }}
          INTAKE_RUN_ID: ${{ steps.intake.outputs.run_id }}
          ARTIFACT_NAME: ${{ steps.intake.outputs.artifact_name }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/external-ratchet-intake
          gh run download "${INTAKE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${ARTIFACT_NAME}" \
            --dir .tmp/external-ratchet-intake
          for name in closure-candidate-receipt.json intake-receipt.json source-provenance.json; do
            test -f ".tmp/external-ratchet-intake/${name}"
            test ! -L ".tmp/external-ratchet-intake/${name}"
          done

      - name: Finish immutable host binding
        run: |
          set -euo pipefail
          rtk python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path(".cache/knowledge-hub/external-ratchet")
          binding = json.loads(
              (root / "host-binding-pre.json").read_text(encoding="utf-8")
          )
          intake = Path(".tmp/external-ratchet-intake/intake-receipt.json")
          binding["intake_receipt_sha256"] = hashlib.sha256(
              intake.read_bytes()
          ).hexdigest()

          from tools.codex_assets.knowledge_hub.schemas import validate_instance

          validation = validate_instance(
              Path(".").resolve(),
              "external-evidence-intake-host-binding-v1",
              binding,
          )
          if validation.get("status") != "pass":
              raise SystemExit(
                  "external intake host binding contract validation failed: {}".format(
                      validation.get("errors", [])
                  )
              )
          (root / "host-binding.json").write_text(
              json.dumps(binding, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build deterministic machine ratchet candidate
        run: |
          set -euo pipefail
          rtk python3 -m tools.codex_assets.knowledge_hub.external_evidence_ratchet_cli \
            --closure-receipt .tmp/external-ratchet-intake/closure-candidate-receipt.json \
            --intake-receipt .tmp/external-ratchet-intake/intake-receipt.json \
            --host-binding .cache/knowledge-hub/external-ratchet/host-binding.json \
            --candidate-registry .cache/knowledge-hub/external-ratchet/candidate-registry.json \
            --proposal .cache/knowledge-hub/external-ratchet/ratchet-proposal.json

      - name: Prepare durable external ratchet record
        id: material
        env:
          GAP: ${{ steps.intake.outputs.gap }}
        run: |
          set -euo pipefail
          rtk python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from tools.codex_assets.knowledge_hub.schemas import validate_instance

          cache = Path(".cache/knowledge-hub/external-ratchet")
          proposal = json.loads(
              (cache / "ratchet-proposal.json").read_text(encoding="utf-8")
          )
          candidate = json.loads(
              (cache / "candidate-registry.json").read_text(encoding="utf-8")
          )
          gap = os.environ["GAP"]
          proposal_validation = validate_instance(
              Path(".").resolve(),
              "external-evidence-ratchet-proposal-v2",
              proposal,
          )
          if proposal_validation.get("status") != "pass":
              raise SystemExit(
                  "external ratchet proposal contract validation failed: {}".format(
                      proposal_validation.get("errors", [])
                  )
              )
          if proposal.get("status") != "ready-for-machine-ratchet":
              raise SystemExit("external ratchet proposal is not machine-ready")
          if proposal.get("authorization_class") != "autonomous-low-risk-ratchet":
              raise SystemExit("external ratchet authorization class mismatch")
          if proposal.get("review_required") is not False:
              raise SystemExit("external ratchet must not require duplicate review")
          if proposal.get("gap_id") != gap:
              raise SystemExit("external ratchet proposal gap mismatch")

          gaps = [
              row
              for row in candidate.get("external_closure_gaps", [])
              if isinstance(row, dict) and row.get("id") == gap
          ]
          if len(gaps) != 1 or gaps[0].get("status") != "closed":
              raise SystemExit("candidate does not close exactly the selected gap")
          evidence = gaps[0].get("evidence") or {}
          if evidence.get("terminal_claimed") is not False:
              raise SystemExit("external ratchet must not claim terminal closure")
          for key in (
              "synthetic_evidence_accepted",
              "mock_evidence_accepted",
              "local_only_evidence_accepted",
              "canonical_write_performed_by_evidence_chain",
          ):
              if evidence.get(key) is not False:
                  raise SystemExit("{} must remain false".format(key))

          digests = {}
          for key, filename in (
              ("candidate_registry", "candidate-registry.json"),
              ("ratchet_proposal", "ratchet-proposal.json"),
              ("host_binding", "host-binding.json"),
          ):
              digests[key] = "sha256:" + hashlib.sha256(
                  (cache / filename).read_bytes()
              ).hexdigest()
          for key, filename in (
              ("closure_receipt", "closure-candidate-receipt.json"),
              ("intake_receipt", "intake-receipt.json"),
          ):
              digests[key] = "sha256:" + hashlib.sha256(
                  (Path(".tmp/external-ratchet-intake") / filename).read_bytes()
              ).hexdigest()

          record = {
              "schema_version": 1,
              "event_id": "external-evidence-{}-{}-{}".format(
                  gap,
                  os.environ["GITHUB_RUN_ID"],
                  os.environ["GITHUB_RUN_ATTEMPT"],
              ),
              "event_type": "external-evidence-ratchet",
              "source_revision": os.environ["SOURCE_REVISION"],
              "observed_at": str(proposal["generated_at"]),
              "evidence_refs": list(gaps[0].get("evidence_refs") or []),
              "digests": digests,
              "expires_at": None,
              "notes": (
                  "Strict real-world evidence validated and projected into a "
                  "machine-ratchet candidate; no synthetic/owner decision inferred."
              ),
          }
          validation = validate_instance(
              Path(".").resolve(), "durable-evidence-record-v1", record
          )
          if validation.get("status") != "pass":
              raise SystemExit(
                  "durable external ratchet record failed schema: {}".format(
                      validation.get("errors", [])
                  )
              )
          (cache / "durable-record.json").write_text(
              json.dumps(record, ensure_ascii=False, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(
                  "candidate_sha={}\n".format(
                      str(proposal["candidate_registry_sha256"])
                  )
              )
          PY

      - name: Prove canonical registry stayed untouched before PR materialization
        run: |
          set -euo pipefail
          git diff --exit-code -- registry/knowledge-platform-p5-p10.json
          git status --short -- registry/knowledge-platform-p5-p10.json

      - name: Upload bounded ratchet origin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knowledge-hub-external-ratchet-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/knowledge-hub/external-ratchet/host-binding.json
            .cache/knowledge-hub/external-ratchet/candidate-registry.json
            .cache/knowledge-hub/external-ratchet/ratchet-proposal.json
            .cache/knowledge-hub/external-ratchet/durable-record.json
            .tmp/external-ratchet-intake/closure-candidate-receipt.json
            .tmp/external-ratchet-intake/intake-receipt.json
            .tmp/external-ratchet-intake/source-provenance.json
          if-no-files-found: error
          retention-days: 90

      - name: Create governed external evidence PR
        env:
          GH_TOKEN: ${{ github.token }}
          GAP: ${{ steps.intake.outputs.gap }}
          CANDIDATE_SHA: ${{ steps.material.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          cache=".cache/knowledge-hub/external-ratchet"
          short_candidate="${CANDIDATE_SHA:0:12}"
          short_source="${SOURCE_REVISION:0:12}"
          title="chore(external): ratchet ${GAP} ${short_candidate} @ ${short_source}"
          branch="automation/external-gap-${GAP}-${short_source}-${GITHUB_RUN_ID}"

          ensure_quality() {
            local quality_branch="$1"
            local quality_sha="$2"
            local active
            active="$(
              gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/runs?branch=${quality_branch}&per_page=20" \
                --jq '.workflow_runs[] | [.id, .head_sha, .status, (.conclusion // "")] | @tsv' \
              | awk -v sha="${quality_sha}" \
                  '$2 == sha && ($3 == "queued" || $3 == "in_progress" || $3 == "waiting" || $3 == "requested") {print $1; exit}'
            )"
            if [[ -n "${active}" ]]; then
              echo "exact-head Quality already active: ${active}"
              return 0
            fi
            gh workflow run quality.yml \
              --repo "${GITHUB_REPOSITORY}" \
              --ref "${quality_branch}"
          }

          existing="$(
            gh pr list --repo "${GITHUB_REPOSITORY}" --state open --limit 100 \
              --json number,title,headRefName,headRefOid \
              --jq ".[] | select(.title == \"${title}\") | [.number,.headRefName,.headRefOid] | @tsv" \
            | head -n 1
          )"
          if [[ -n "${existing}" ]]; then
            IFS=$'\t' read -r number existing_branch existing_sha <<< "${existing}"
            ensure_quality "${existing_branch}" "${existing_sha}"
            echo "identical external ratchet PR already open: #${number}"
            exit 0
          fi

          cp "${cache}/candidate-registry.json" registry/knowledge-platform-p5-p10.json
          cat "${cache}/durable-record.json" >> registry/durable-evidence-ledger.jsonl
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(
            printf '%s\n' \
              registry/durable-evidence-ledger.jsonl \
              registry/knowledge-platform-p5-p10.json \
            | sort
          )"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "external evidence ratchet changed paths outside allowlist" >&2
            exit 1
          fi

          git config user.name "knowledge-hub-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add registry/knowledge-platform-p5-p10.json registry/durable-evidence-ledger.jsonl
          git commit -m "${title}"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "${remote}" "HEAD:refs/heads/${branch}"

          set +e
          url="$(
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base master \
              --head "${branch}" \
              --title "${title}" \
              --body "Machine-generated closure ratchet from strict real external evidence. The observation itself came from a real-world boundary; this PR only applies the validator-proven canonical gap transition and one durable evidence identity. No owner/project readiness/terminal state is inferred."
          )"
          rc=$?
          set -e
          if [[ "${rc}" -ne 0 ]]; then
            git push "${remote}" --delete "${branch}" || true
            exit 1
          fi
          number="$(gh pr view "${url}" --repo "${GITHUB_REPOSITORY}" --json number --jq .number)"
          ensure_quality "${branch}" "$(git rev-parse HEAD)"

          for stale in $(
            gh pr list --repo "${GITHUB_REPOSITORY}" --state open --limit 100 \
              --json number,headRefName \
              --jq ".[] | select(.headRefName | startswith(\"automation/external-gap-${GAP}-\")) | .number"
          ); do
            if [[ "${stale}" == "${number}" ]]; then
              continue
            fi
            gh pr close "${stale}" --repo "${GITHUB_REPOSITORY}" \
              --comment "Superseded by fresh strict external evidence ratchet #${number}."
          done

  automation-branch-gc:
    name: Retire closed external ratchet branch
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'automation/external-gap-')
      }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete closed same-repository external branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ ! "${HEAD_REF}" =~ ^automation/external-gap-(connector-provider-pilot|production-retrieval-eval|memory-lifecycle-pilot|real-adoption-evidence)-[0-9a-f]{12}-[0-9]+$ ]]; then
            echo "external ratchet branch failed bounded grammar" >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${HEAD_REF}" >/dev/null 2>&1; then
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_REF}"
          fi
