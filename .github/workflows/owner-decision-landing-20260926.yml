name: owner-decision-landing-20260926

on:
  push:
    branches:
      - automation/owner-decisions-20260926

permissions:
  contents: write

concurrency:
  group: owner-decision-landing-20260926
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-runtime.lock

      - name: Bootstrap governed CI transport
        shell: bash
        run: tools/ci/rtk bash tools/ci/bootstrap-path.sh

      - name: Install hash-locked runtime dependencies
        shell: bash
        run: rtk python3 -m pip install --require-hashes -r requirements-runtime.lock

      - name: Verify exact master baseline and bootstrap-only diff
        shell: bash
        env:
          BASE_SHA: 8d3053c2d60c1f3a980a114475f6f5422a84dbd4
        run: |
          set -euo pipefail
          rtk git fetch origin master
          test "$(rtk git rev-parse origin/master)" = "$BASE_SHA"
          test "$(rtk git diff --name-only "$BASE_SHA..HEAD")" = ".github/workflows/owner-decision-landing-20260926.yml"

      - name: Register exact active-promotion execution authorization
        shell: bash
        run: |
          set -euo pipefail
          rtk python3 - <<'PY'
          import pathlib
          import subprocess
          from tools.codex_assets.knowledge_hub.common import encode_jsonl, load_jsonl

          path = pathlib.Path("registry/authorizations.jsonl")
          rows = load_jsonl(path)
          auth_id = "auth-20260926-llm-agent-adk-target-architecture-active"
          if any(str(row.get("authorization_id", "")) == auth_id for row in rows):
              raise SystemExit("authorization id already exists")
          rows.append({
              "authorization_id": auth_id,
              "authorized_by": "jiying2007",
              "authorized_at": "2026-09-26",
              "scope": (
                  "Knowledge Hub lifecycle transition for exactly item "
                  "llm-agent-adk-target-architecture at "
                  "projects/llm-agent/architecture/llm-agent-adk-target-architecture.md "
                  "from reviewing to active, bound to full content SHA256 "
                  "79df388921bb6cd3971083e4baf3f5298f0641ca65533022a1bc333ef3862d24 "
                  "and confirmation token KH-ATTEST-93a8bf783d762dae4e5e. "
                  "May mechanically generate the direct human-reviewed attestation and apply the "
                  "canonical active-promotion transaction. No source-project write, memory write, "
                  "other lifecycle decision, synthetic evidence, tag, release, or unrelated state change."
              ),
              "allowed_actions": ["active-promotion"],
              "expires_at": "2026-09-27",
              "evidence_refs": [
                  "https://github.com/jiying2007/knowledge-hub/issues/125#issuecomment-5847182575",
                  "content_sha256 79df388921bb6cd3971083e4baf3f5298f0641ca65533022a1bc333ef3862d24",
                  "confirmation_token KH-ATTEST-93a8bf783d762dae4e5e"
              ],
              "rollback_path": (
                  "Revert only the exact lifecycle transaction and derived views through a separate "
                  "reviewed revert; preserve unrelated history and never force-update master."
              ),
              "validation_commands": [
                  "rtk bash tools/knowledge-promote.sh --dry-run --json --id llm-agent-adk-target-architecture --target active",
                  "rtk bash tools/knowledge-check.sh --dry-run --json --diagnostics",
                  "rtk bash tools/knowledge-search.sh llm-agent-adk-target-architecture --json"
              ],
              "status": "active"
          })
          path.write_text(encode_jsonl(rows), encoding="utf-8")
          PY

      - name: Generate exact #125 human-reviewed attestation and apply canonical promotion
        shell: bash
        run: |
          set -euo pipefail
          statement='I, GitHub user `jiying2007`, am recording the real human owner/reviewer decision for item `llm-agent-adk-target-architecture`: current lifecycle `reviewing`, chosen lifecycle `active`, full content SHA-256 `79df388921bb6cd3971083e4baf3f5298f0641ca65533022a1bc333ef3862d24`, confirmation token `KH-ATTEST-93a8bf783d762dae4e5e`, reviewed_by=jiying2007. Decision: ACTIVATE.'
          rtk bash tools/knowledge-review-attest.sh generate             --as-of 2026-09-26             --id llm-agent-adk-target-architecture             --target active             --expected-sha256 79df388921bb6cd3971083e4baf3f5298f0641ca65533022a1bc333ef3862d24             --attestation-mode human-reviewed             --attested-by jiying2007             --attested-at 2026-09-26             --attestation-source-ref 'https://github.com/jiying2007/knowledge-hub/issues/125#issuecomment-5847182575'             --attestation-text "$statement"             --confirm-attestation             --output artifacts/manifests/llm-agent-adk-target-architecture-active-review-20260926.local.jsonl             --apply --json
          rtk bash tools/knowledge-promote.sh             --as-of 2026-09-26             --id llm-agent-adk-target-architecture             --target active             --authorization-id auth-20260926-llm-agent-adk-target-architecture-active             --forms artifacts/manifests/llm-agent-adk-target-architecture-active-review-20260926.local.jsonl             --expected-sha256 79df388921bb6cd3971083e4baf3f5298f0641ca65533022a1bc333ef3862d24             --reason 'Human owner/reviewer chose ACTIVATE in #125; exact SHA/token-bound decision recorded in issue comment 5847182575.'             --apply --json

      - name: Verify and land #74 Batch A evidence-ready declaration
        shell: bash
        run: |
          set -euo pipefail
          rtk python3 - <<'PY'
          import copy
          import json
          import pathlib
          from tools.codex_assets.knowledge_hub.common import encode_jsonl, load_jsonl
          from tools.codex_assets.knowledge_hub.owner_qualification_packet import build_owner_qualification_packet

          root = pathlib.Path(".").resolve()
          source_master_sha = "8d3053c2d60c1f3a980a114475f6f5422a84dbd4"
          expected_full_packet_fingerprint = "sha256:97694cc1f25819335a6b68d6f1bfbdda1e868a9b44e022183fb0d5c1959a42f7"
          expected_batch_fingerprint = "sha256:db1f708ebed4a032d831ee4522edb5a66cd8e1f2072b11da114a64e3d214edae"
          targets = [
              "agent-dev-kit",
              "knowledge-hub",
              "llm-tools",
              "mm32spin-validator",
              "ota-packager",
              "sigmastar-flasher",
          ]
          packet = build_owner_qualification_packet(root)
          if packet.get("packet_fingerprint") != expected_full_packet_fingerprint:
              raise SystemExit(
                  "full owner packet drifted: expected %s got %s"
                  % (expected_full_packet_fingerprint, packet.get("packet_fingerprint"))
              )
          rows_by_project = {row["project_id"]: row for row in packet.get("rows", [])}
          for project_id in targets:
              row = rows_by_project.get(project_id)
              if not row:
                  raise SystemExit("missing packet row: " + project_id)
              if not row.get("owner_declaration_pending"):
                  raise SystemExit("project is not declaration-pending: " + project_id)
              if row.get("owner_boundary_pending"):
                  raise SystemExit("owner boundary is not ready: " + project_id)
              if row.get("real_evidence_pending"):
                  raise SystemExit("real evidence is not field-complete: " + project_id)

          manifest_path = pathlib.Path(
              "artifacts/manifests/knowledge-hub-owner-evidence-ready-batch-a-20260926.md"
          )
          items_path = pathlib.Path("registry/items.jsonl")
          items = load_jsonl(items_path)
          selected = {}
          for item in items:
              project_id = str(item.get("project_id", ""))
              if project_id not in targets or item.get("readiness_slot") != "validation":
                  continue
              if project_id in selected:
                  raise SystemExit("duplicate validation item for " + project_id)
              contract = item.get("evidence_contract")
              if not isinstance(contract, dict):
                  raise SystemExit("missing evidence contract for " + project_id)
              selected[project_id] = item
          if set(selected) != set(targets):
              raise SystemExit("validation item coverage mismatch: " + repr(sorted(selected)))

          baseline_text = subprocess.check_output(
              ["rtk", "git", "show", source_master_sha + ":registry/items.jsonl"],
              text=True,
          )
          baseline_items = [
              json.loads(line) for line in baseline_text.splitlines() if line.strip()
          ]
          baseline_selected = {
              str(item.get("project_id", "")): item
              for item in baseline_items
              if str(item.get("project_id", "")) in targets
              and item.get("readiness_slot") == "validation"
          }
          if set(baseline_selected) != set(targets):
              raise SystemExit("baseline Batch A validation coverage mismatch")
          bound_fields = ("id", "decision_owner", "status", "evidence_contract")
          for project_id in targets:
              current = selected[project_id]
              baseline = baseline_selected[project_id]
              for field in bound_fields:
                  if current.get(field) != baseline.get(field):
                      raise SystemExit(
                          "Batch A bound field drifted for %s.%s" % (project_id, field)
                      )

          previous_owner_refs = {}
          for project_id in targets:
              item = selected[project_id]
              contract = copy.deepcopy(item["evidence_contract"])
              if contract.get("status") != "pending":
                  raise SystemExit(
                      "%s contract status is not pending: %r"
                      % (project_id, contract.get("status"))
                  )
              previous_owner_refs[project_id] = copy.deepcopy(contract.get("owner_ref"))
              contract["status"] = "ready"
              contract["owner_ref"] = {
                  "kind": "owner-evidence-ready-declaration",
                  "ref": str(manifest_path) + "#" + project_id,
                  "decision_source": "https://github.com/jiying2007/knowledge-hub/issues/74#issuecomment-5847182834",
                  "packet_fingerprint": expected_batch_fingerprint,
                  "reviewed_by": "jiying2007",
                  "reviewed_at": "2026-09-26",
                  "previous_owner_ref": previous_owner_refs[project_id],
              }
              item["evidence_contract"] = contract

          manifest_lines = [
              "# Knowledge Hub Batch A evidence-ready owner declaration",
              "",
              "- issue: `#74`",
              "- decision source: `https://github.com/jiying2007/knowledge-hub/issues/74#issuecomment-5847182834`",
              "- reviewer: `jiying2007`",
              "- reviewed_at: `2026-09-26`",
              "- exact canonical owner packet: `%s`" % expected_full_packet_fingerprint,
              "- exact Batch A decision fingerprint: `%s`" % expected_batch_fingerprint,
              "- bound source master: `%s`" % source_master_sha,
              "- decision: accept Batch A current evidence contracts as `evidence-ready`",
              "- Batch B: not decided by this declaration",
              "- synthetic evidence / missing real evidence: not authorized",
              "",
              "## Batch A",
              "",
          ]
          for project_id in targets:
              manifest_lines.append(
                  "- `%s`: `pending -> ready`; prior owner_ref preserved in registry audit metadata."
                  % project_id
              )
          manifest_lines += [
              "",
              "This declaration changes only the exact six project evidence-contract owner declaration states. "
              "It does not create device, artifact, release, rollback, production, adoption, provider, or ACL evidence.",
              "",
          ]
          manifest_path.write_text("\n".join(manifest_lines), encoding="utf-8")
          items_path.write_text(encode_jsonl(items), encoding="utf-8")

          post = build_owner_qualification_packet(root)
          post_rows = {row["project_id"]: row for row in post.get("rows", [])}
          for project_id in targets:
              row = post_rows[project_id]
              if row.get("evidence_status") != "ready":
                  raise SystemExit("post-declaration evidence is not ready: " + project_id)
              if row.get("owner_declaration_pending"):
                  raise SystemExit("post-declaration still pending: " + project_id)
          pathlib.Path("/tmp/owner-qualification-post.json").write_text(
              json.dumps(post, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "status": "applied",
              "pre_full_packet_fingerprint": expected_full_packet_fingerprint,
              "batch_a_decision_fingerprint": expected_batch_fingerprint,
              "bound_source_master": source_master_sha,
              "post_fingerprint": post.get("packet_fingerprint"),
              "batch_a_ready": targets,
              "remaining_owner_declaration_projects": post.get("owner_declaration_projects", []),
              "remaining_real_evidence_projects": post.get("real_evidence_projects", []),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Run focused fail-closed validation
        shell: bash
        run: |
          set -euo pipefail
          rtk bash tools/knowledge-project-readiness.sh --check --as-of 2026-09-26 --json
          rtk bash tools/knowledge-check.sh --dry-run --as-of 2026-09-26 --json --diagnostics
          rtk bash tools/knowledge-obsidian-view-build.sh --check --json
          rtk bash tools/knowledge-search.sh llm-agent-adk-target-architecture --json
          rtk git diff --check

      - name: Remove one-shot executor, commit canonical result, and push branch
        shell: bash
        run: |
          set -euo pipefail
          rtk rm .github/workflows/owner-decision-landing-20260926.yml
          rtk git config user.name "github-actions[bot]"
          rtk git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rtk git add -A
          if rtk git diff --cached --quiet; then
            echo "no canonical changes produced" >&2
            exit 1
          fi
          if rtk git diff --cached --name-only | rtk grep -Fx '.github/workflows/owner-decision-landing-20260926.yml'; then
            :
          fi
          rtk git diff --cached --check
          rtk git commit -m "governance(owner): land #125 activation and Batch A readiness"
          rtk git push origin HEAD:refs/heads/automation/owner-decisions-20260926
