name: readiness-validation-split-once

on:
  push:
    branches:
      - codex/readiness-doc-template-drift
    paths:
      - .github/workflows/readiness-validation-split-once.yml

permissions:
  contents: write

jobs:
  split-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/readiness-doc-template-drift
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Bootstrap governed CI transport
        run: tools/ci/rtk bash tools/ci/bootstrap-path.sh
      - name: Install hash-locked dependencies
        run: rtk python3 -m pip install --require-hashes -r requirements-dev.lock
      - name: Apply bounded validation split
        run: rtk python3 tools/ci/readiness_validation_split_once.py
      - name: Verify bounded paths
        shell: bash
        run: |
          rtk python3 - <<'PY'
          import subprocess
          expected = {
              'tools/codex_assets/knowledge_hub/project_readiness.py',
              'tools/codex_assets/knowledge_hub/project_readiness_validation.py',
              'tests/test_project_readiness.py',
          }
          tracked = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          actual = tracked | untracked
          if actual != expected:
              raise SystemExit('unexpected changed paths: {}'.format(sorted(actual)))
          PY
          rtk git diff --check
      - name: Run targeted readiness regressions
        run: rtk python3 -m pytest -q tests/test_project_readiness.py tests/test_evidence.py tests/test_complexity_budget.py::test_check_split_eliminates_repository_oversized_module_debt
      - name: Stage bounded candidate for repository-aware tests
        run: rtk git add tools/codex_assets/knowledge_hub/project_readiness.py tools/codex_assets/knowledge_hub/project_readiness_validation.py tests/test_project_readiness.py
      - name: Run full unit suite
        run: rtk python3 -m pytest -q
      - name: Verify readiness idempotence
        run: rtk python3 -m tools.codex_assets.knowledge_hub.project_readiness_cli --check --as-of 2026-07-13 --json
      - name: Run focused Ruff
        run: rtk python3 -m ruff check tools/codex_assets/knowledge_hub/project_readiness.py tools/codex_assets/knowledge_hub/project_readiness_validation.py tests/test_project_readiness.py
      - name: Commit split
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Split readiness validation semantics from generator'
          git push origin HEAD:codex/readiness-doc-template-drift
