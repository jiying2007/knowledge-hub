name: readiness-validation-split-once

on:
  push:
    branches:
      - codex/readiness-doc-template-drift
    paths:
      - .github/workflows/readiness-validation-split-once.yml

permissions:
  contents: write

jobs:
  split-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/readiness-doc-template-drift
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply bounded validation split
        run: python tools/ci/readiness_validation_split_once.py
      - name: Verify bounded paths
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'tools/codex_assets/knowledge_hub/project_readiness.py',
              'tools/codex_assets/knowledge_hub/project_readiness_validation.py',
              'tests/test_project_readiness.py',
          }
          tracked = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          actual = tracked | untracked
          if actual != expected:
              raise SystemExit('unexpected changed paths: {}'.format(sorted(actual)))
          PY
          git diff --check
      - name: Run targeted readiness regressions
        run: python -m pytest -q tests/test_project_readiness.py tests/test_evidence.py tests/test_complexity_budget.py::test_check_split_eliminates_repository_oversized_module_debt
      - name: Run full unit suite
        run: python -m pytest -q
      - name: Verify readiness idempotence
        run: python -m tools.codex_assets.knowledge_hub.project_readiness_cli --check --as-of 2026-07-13 --json
      - name: Run focused Ruff
        run: python -m ruff check tools/codex_assets/knowledge_hub/project_readiness.py tools/codex_assets/knowledge_hub/project_readiness_validation.py tests/test_project_readiness.py
      - name: Commit split
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/codex_assets/knowledge_hub/project_readiness.py tools/codex_assets/knowledge_hub/project_readiness_validation.py tests/test_project_readiness.py
          git commit -m 'Split readiness validation semantics from generator'
          git push origin HEAD:codex/readiness-doc-template-drift
