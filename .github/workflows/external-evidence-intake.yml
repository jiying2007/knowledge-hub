name: external-evidence-intake

on:
  workflow_dispatch:
    inputs:
      expected_gap:
        description: Required external terminal gap
        required: true
        type: choice
        options:
          - connector-provider-pilot
          - production-retrieval-eval
          - memory-lifecycle-pilot
          - real-adoption-evidence
      source_run_id:
        description: Successful same-repository Actions run containing the evidence artifact
        required: true
        type: string
      artifact_name:
        description: Exact source artifact name
        required: true
        type: string
      evidence_file:
        description: Evidence JSON filename at the artifact root
        required: true
        default: external-evidence.json
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: external-evidence-intake-${{ github.ref }}-${{ inputs.expected_gap }}-${{ inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  intake:
    name: Validate real external closure evidence
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable intake revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up governed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Bootstrap governed CI transport
        run: tools/ci/rtk bash tools/ci/bootstrap-path.sh
      - name: Install hash-locked dependencies
        run: rtk python3 -m pip install --require-hashes -r requirements-dev.lock
      - name: Validate intake selectors
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          EVIDENCE_FILE: ${{ inputs.evidence_file }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_RUN_ID}" =~ ^[0-9]+$ ]] || { echo "source_run_id must be numeric" >&2; exit 2; }
          [[ "${ARTIFACT_NAME}" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "artifact_name contains unsupported characters" >&2; exit 2; }
          [[ "${EVIDENCE_FILE}" =~ ^[A-Za-z0-9._-]+\.json$ ]] || { echo "evidence_file must be a root JSON filename" >&2; exit 2; }
      - name: Verify successful same-repository source run and artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          mkdir -p .cache/knowledge-hub/external-evidence
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > .cache/knowledge-hub/external-evidence/source-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" > .cache/knowledge-hub/external-evidence/source-artifacts.json
          rtk python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('.cache/knowledge-hub/external-evidence')
          run = json.loads((root / 'source-run.json').read_text(encoding='utf-8'))
          expected_repo = os.environ['GITHUB_REPOSITORY']
          if run.get('status') != 'completed' or run.get('conclusion') != 'success':
              raise SystemExit('source workflow run must be completed/success')
          repository = run.get('repository') or {}
          if repository.get('full_name') != expected_repo:
              raise SystemExit('source workflow run must belong to the current repository')
          head_sha = str(run.get('head_sha') or '')
          if len(head_sha) != 40 or any(ch not in '0123456789abcdef' for ch in head_sha.lower()):
              raise SystemExit('source workflow run must expose an exact git revision')

          artifact_doc = json.loads((root / 'source-artifacts.json').read_text(encoding='utf-8'))
          wanted = os.environ['ARTIFACT_NAME']
          matches = [item for item in artifact_doc.get('artifacts', []) if item.get('name') == wanted]
          if len(matches) != 1:
              raise SystemExit('expected exactly one source artifact with the requested name')
          artifact = matches[0]
          if artifact.get('expired') is True:
              raise SystemExit('source artifact is expired')
          digest = str(artifact.get('digest') or '')
          if not digest.startswith('sha256:') or len(digest) != 71:
              raise SystemExit('source artifact must expose a sha256 digest')
          bounded = {
              'schema_version': 1,
              'repository': expected_repo,
              'source_run_id': int(run['id']),
              'source_run_head_sha': head_sha,
              'source_run_event': str(run.get('event') or ''),
              'artifact_id': int(artifact['id']),
              'artifact_name': str(artifact['name']),
              'artifact_digest': digest,
          }
          (root / 'source-provenance.json').write_text(
              json.dumps(bounded, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Download exact source artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/external-evidence-source
          gh run download "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${ARTIFACT_NAME}" --dir .tmp/external-evidence-source
      - name: Validate evidence and emit closure candidate receipt
        env:
          EXPECTED_GAP: ${{ inputs.expected_gap }}
          EVIDENCE_FILE: ${{ inputs.evidence_file }}
        run: |
          set -euo pipefail
          test -f ".tmp/external-evidence-source/${EVIDENCE_FILE}"
          test ! -L ".tmp/external-evidence-source/${EVIDENCE_FILE}"
          rtk python3 -m tools.codex_assets.knowledge_hub.external_evidence_cli \
            --input ".tmp/external-evidence-source/${EVIDENCE_FILE}" \
            --expected-gap "${EXPECTED_GAP}" \
            --output .cache/knowledge-hub/external-evidence/closure-candidate-receipt.json
      - name: Bind receipt to intake provenance
        env:
          EXPECTED_GAP: ${{ inputs.expected_gap }}
        run: |
          set -euo pipefail
          rtk python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('.cache/knowledge-hub/external-evidence')
          receipt_path = root / 'closure-candidate-receipt.json'
          receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
          provenance = json.loads((root / 'source-provenance.json').read_text(encoding='utf-8'))
          if receipt.get('gap_id') != os.environ['EXPECTED_GAP'] or receipt.get('closure_ready') is not True:
              raise SystemExit('validated receipt is not closure-ready for the requested gap')
          if receipt.get('canonical_write_performed') is not False:
              raise SystemExit('intake must never perform a canonical write')
          envelope = {
              'schema_version': 1,
              'projection': 'knowledge-hub-external-evidence-intake-v1',
              'status': 'pass',
              'closure_candidate_only': True,
              'canonical_write_performed': False,
              'gap_id': receipt['gap_id'],
              'source_revision': receipt['source_revision'],
              'evidence_payload_sha256': receipt['evidence_payload_sha256'],
              'receipt_sha256': hashlib.sha256(receipt_path.read_bytes()).hexdigest(),
              'source_provenance': provenance,
              'intake_run_id': int(os.environ['GITHUB_RUN_ID']),
              'intake_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'intake_revision': os.environ['GITHUB_SHA'],
          }
          (root / 'intake-receipt.json').write_text(
              json.dumps(envelope, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Upload bounded intake receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knowledge-hub-external-evidence-${{ inputs.expected_gap }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/knowledge-hub/external-evidence/source-provenance.json
            .cache/knowledge-hub/external-evidence/closure-candidate-receipt.json
            .cache/knowledge-hub/external-evidence/intake-receipt.json
          if-no-files-found: error
          retention-days: 90
