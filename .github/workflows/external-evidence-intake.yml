name: external-evidence-intake

on:
  workflow_run:
    workflows:
      - external-pilot-evidence-producer
    types:
      - completed
  workflow_dispatch:
    inputs:
      expected_gap:
        description: Required external operational gap
        required: true
        type: choice
        options:
          - connector-provider-pilot
          - production-retrieval-eval
          - memory-lifecycle-pilot
          - real-adoption-evidence
      source_run_id:
        description: Successful same-repository Actions run containing the evidence artifact
        required: true
        type: string
      artifact_name:
        description: Exact source artifact name
        required: true
        type: string
      evidence_file:
        description: Evidence JSON filename at the artifact root
        required: true
        default: external-evidence.json
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: external-evidence-intake-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  intake:
    name: Validate real external closure evidence
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'master')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INTAKE_REVISION: ${{ github.workflow_sha }}

    steps:
      - name: Checkout trusted intake revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.INTAKE_REVISION }}
          persist-credentials: false

      - name: Set up governed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-runtime.lock

      - name: Bootstrap governed CI transport
        run: tools/ci/rtk bash tools/ci/bootstrap-path.sh

      - name: Install hash-locked runtime dependencies
        run: rtk python3 -m pip install --require-hashes -r requirements-runtime.lock

      - name: Resolve and verify source evidence
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          AUTO_SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
          MANUAL_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          MANUAL_ARTIFACT_NAME: ${{ inputs.artifact_name }}
          MANUAL_EXPECTED_GAP: ${{ inputs.expected_gap }}
          MANUAL_EVIDENCE_FILE: ${{ inputs.evidence_file }}
        run: |
          set -euo pipefail
          cache=".cache/knowledge-hub/external-evidence"
          mkdir -p "${cache}"

          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            source_run_id="${AUTO_SOURCE_RUN_ID}"
          else
            source_run_id="${MANUAL_SOURCE_RUN_ID}"
          fi
          [[ "${source_run_id}" =~ ^[0-9]+$ ]] || {
            echo "source_run_id must be numeric" >&2
            exit 2
          }

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}" \
            > "${cache}/source-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}/artifacts?per_page=100" \
            > "${cache}/source-artifacts.json"

          SOURCE_RUN_ID="${source_run_id}" rtk python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          cache = Path(".cache/knowledge-hub/external-evidence")
          run = json.loads((cache / "source-run.json").read_text(encoding="utf-8"))
          artifacts = json.loads(
              (cache / "source-artifacts.json").read_text(encoding="utf-8")
          )
          repository = os.environ["GITHUB_REPOSITORY"]
          event_name = os.environ["EVENT_NAME"]
          run_id = int(os.environ["SOURCE_RUN_ID"])

          if run.get("id") != run_id:
              raise SystemExit("source workflow run identity mismatch")
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit("source workflow run must be completed/success")
          if (run.get("repository") or {}).get("full_name") != repository:
              raise SystemExit("source workflow run must belong to the current repository")
          head_sha = str(run.get("head_sha") or "").lower()
          if not re.fullmatch(r"[0-9a-f]{40}", head_sha):
              raise SystemExit("source workflow run must expose an exact git revision")

          rows = [
              row
              for row in artifacts.get("artifacts", [])
              if isinstance(row, dict) and row.get("expired") is not True
          ]
          if event_name == "workflow_run":
              if run.get("path") != ".github/workflows/external-pilot-evidence-producer.yml":
                  raise SystemExit("automatic intake source must be external-pilot-evidence-producer")
              if run.get("event") != "workflow_dispatch" or run.get("head_branch") != "master":
                  raise SystemExit("automatic producer run must be master workflow_dispatch")
              pattern = re.compile(
                  r"^knowledge-hub-external-pilot-evidence-"
                  r"(connector-provider-pilot|production-retrieval-eval|memory-lifecycle-pilot|real-adoption-evidence)-"
                  + str(run_id)
                  + r"-"
                  + str(int(run.get("run_attempt", 0) or 0))
                  + r"$"
              )
              matches = [
                  row
                  for row in rows
                  if pattern.fullmatch(str(row.get("name") or ""))
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      "automatic intake requires exactly one strict producer artifact"
                  )
              artifact = matches[0]
              match = pattern.fullmatch(str(artifact["name"]))
              if match is None:
                  raise SystemExit("strict producer artifact identity is invalid")
              gap = match.group(1)
              evidence_file = "external-evidence.json"
          else:
              artifact_name = os.environ["MANUAL_ARTIFACT_NAME"]
              gap = os.environ["MANUAL_EXPECTED_GAP"]
              evidence_file = os.environ["MANUAL_EVIDENCE_FILE"]
              if not re.fullmatch(r"[A-Za-z0-9._-]+", artifact_name):
                  raise SystemExit("artifact_name contains unsupported characters")
              if not re.fullmatch(r"[A-Za-z0-9._-]+\.json", evidence_file):
                  raise SystemExit("evidence_file must be a root JSON filename")
              matches = [
                  row for row in rows if row.get("name") == artifact_name
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      "expected exactly one source artifact with the requested name"
                  )
              artifact = matches[0]

          digest = str(artifact.get("digest") or "")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("source artifact must expose a sha256 digest")

          bounded = {
              "schema_version": 1,
              "repository": repository,
              "source_run_id": run_id,
              "source_run_head_sha": head_sha,
              "source_run_event": str(run.get("event") or ""),
              "artifact_id": int(artifact["id"]),
              "artifact_name": str(artifact["name"]),
              "artifact_digest": digest,
          }
          (cache / "source-provenance.json").write_text(
              json.dumps(bounded, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write("source_run_id={}\n".format(run_id))
              handle.write("artifact_name={}\n".format(artifact["name"]))
              handle.write("expected_gap={}\n".format(gap))
              handle.write("evidence_file={}\n".format(evidence_file))
          PY

      - name: Download exact source artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/external-evidence-source
          gh run download "${SOURCE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${ARTIFACT_NAME}" \
            --dir .tmp/external-evidence-source

      - name: Validate evidence and emit closure candidate receipt
        env:
          EXPECTED_GAP: ${{ steps.source.outputs.expected_gap }}
          EVIDENCE_FILE: ${{ steps.source.outputs.evidence_file }}
        run: |
          set -euo pipefail
          test -f ".tmp/external-evidence-source/${EVIDENCE_FILE}"
          test ! -L ".tmp/external-evidence-source/${EVIDENCE_FILE}"
          rtk python3 -m tools.codex_assets.knowledge_hub.external_evidence_cli \
            --input ".tmp/external-evidence-source/${EVIDENCE_FILE}" \
            --expected-gap "${EXPECTED_GAP}" \
            --output .cache/knowledge-hub/external-evidence/closure-candidate-receipt.json

      - name: Bind receipt to intake provenance
        env:
          EXPECTED_GAP: ${{ steps.source.outputs.expected_gap }}
        run: |
          set -euo pipefail
          rtk python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(".cache/knowledge-hub/external-evidence")
          receipt_path = root / "closure-candidate-receipt.json"
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          provenance = json.loads(
              (root / "source-provenance.json").read_text(encoding="utf-8")
          )
          if (
              receipt.get("gap_id") != os.environ["EXPECTED_GAP"]
              or receipt.get("closure_ready") is not True
          ):
              raise SystemExit(
                  "validated receipt is not closure-ready for the requested gap"
              )
          if receipt.get("canonical_write_performed") is not False:
              raise SystemExit("intake must never perform a canonical write")
          envelope = {
              "schema_version": 1,
              "projection": "knowledge-hub-external-evidence-intake-v1",
              "status": "pass",
              "closure_candidate_only": True,
              "canonical_write_performed": False,
              "gap_id": receipt["gap_id"],
              "source_revision": receipt["source_revision"],
              "evidence_payload_sha256": receipt["evidence_payload_sha256"],
              "receipt_sha256": hashlib.sha256(receipt_path.read_bytes()).hexdigest(),
              "source_provenance": provenance,
              "intake_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "intake_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "intake_revision": os.environ["INTAKE_REVISION"],
          }
          (root / "intake-receipt.json").write_text(
              json.dumps(envelope, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload bounded intake receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knowledge-hub-external-evidence-${{ steps.source.outputs.expected_gap }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/knowledge-hub/external-evidence/source-provenance.json
            .cache/knowledge-hub/external-evidence/closure-candidate-receipt.json
            .cache/knowledge-hub/external-evidence/intake-receipt.json
          if-no-files-found: error
          retention-days: 90
