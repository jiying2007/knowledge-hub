name: Index Plan Split Diagnostic

on:
  push:
    branches:
      - codex/legacy-burndown-index-plan-v1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Inspect index plan structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path

          path = Path('tools/codex_assets/knowledge_hub/index_plan_cli.py')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()
          tree = ast.parse(text)
          print(f'TOTAL_LINES={len(lines)}')
          print('FUNCTIONS')
          for node in tree.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  print(f'{node.name}:{node.lineno}-{node.end_lineno}:{node.end_lineno-node.lineno+1}')
          print('TOP_LEVEL_STATEMENTS')
          for node in tree.body:
              if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.Import, ast.ImportFrom)):
                  print(f'{type(node).__name__}:{node.lineno}-{node.end_lineno}')
          print('MARKERS')
          markers = [
              'def first_present_field',
              'def manifest_profile_health',
              'def build_linking_audit',
              'linking_audit = build_linking_audit()',
              'def compact_index_summary',
              'def print_owner',
          ]
          for marker in markers:
              hits = [i for i, line in enumerate(lines, 1) if marker in line]
              print(f'{marker}={hits}')
          PY
