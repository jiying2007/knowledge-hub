name: Index Plan Direct Import Repair

on:
  push:
    branches:
      - codex/legacy-burndown-index-plan-v1

permissions:
  contents: write

jobs:
  repair:
    if: "${{ !contains(github.event.head_commit.message, 'fix(index-plan): preserve direct script imports') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Bootstrap governed CI transport
        run: tools/ci/rtk bash tools/ci/bootstrap-path.sh
      - name: Install hash-locked dependencies
        run: rtk python3 -m pip install --require-hashes -r requirements-dev.lock
      - name: Preserve package and direct-script import surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/codex_assets/knowledge_hub/index_plan_cli.py')
          text = path.read_text(encoding='utf-8')
          old = '''from .index_plan_linking import build_linking_audit
from .index_plan_manifest import classify_unpaired_manifest, manifest_profile_health
from .index_plan_review_forms import apply_review_queue_filters, configure_review_forms, validate_review_queue_forms
from .index_plan_review_queue import (
    build_review_queue_view,
    configure_review_queue,
    first_present_field,
    make_review_queue_form,
)
from .index_plan_support import (
    display_path,
    emit_json,
    is_local_manifest_draft,
    read_json_array,
    read_jsonl,
    repository_file_sha256,
    select_source_coverage_closeout,
)
'''
          package_imports = '''    from .index_plan_linking import build_linking_audit
    from .index_plan_manifest import classify_unpaired_manifest, manifest_profile_health
    from .index_plan_review_forms import apply_review_queue_filters, configure_review_forms, validate_review_queue_forms
    from .index_plan_review_queue import (
        build_review_queue_view,
        configure_review_queue,
        first_present_field,
        make_review_queue_form,
    )
    from .index_plan_support import (
        display_path,
        emit_json,
        is_local_manifest_draft,
        read_json_array,
        read_jsonl,
        repository_file_sha256,
        select_source_coverage_closeout,
    )
'''
          direct_imports = '''    repository_root = pathlib.Path(__file__).resolve().parents[3]
    if str(repository_root) not in sys.path:
        sys.path.insert(0, str(repository_root))
    from tools.codex_assets.knowledge_hub.index_plan_linking import build_linking_audit
    from tools.codex_assets.knowledge_hub.index_plan_manifest import classify_unpaired_manifest, manifest_profile_health
    from tools.codex_assets.knowledge_hub.index_plan_review_forms import apply_review_queue_filters, configure_review_forms, validate_review_queue_forms
    from tools.codex_assets.knowledge_hub.index_plan_review_queue import (
        build_review_queue_view,
        configure_review_queue,
        first_present_field,
        make_review_queue_form,
    )
    from tools.codex_assets.knowledge_hub.index_plan_support import (
        display_path,
        emit_json,
        is_local_manifest_draft,
        read_json_array,
        read_jsonl,
        repository_file_sha256,
        select_source_coverage_closeout,
    )
'''
          new = 'if __package__:\n' + package_imports + 'else:\n' + direct_imports
          if text.count(old) != 1:
              raise SystemExit(f'expected one import block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rtk python3 -m compileall -q tools/codex_assets/knowledge_hub/index_plan_*.py
          rtk python3 -m ruff check tools/codex_assets/knowledge_hub/index_plan_cli.py tools/codex_assets/knowledge_hub/index_plan_support.py tools/codex_assets/knowledge_hub/index_plan_review_queue.py tools/codex_assets/knowledge_hub/index_plan_review_forms.py tools/codex_assets/knowledge_hub/index_plan_manifest.py tools/codex_assets/knowledge_hub/index_plan_linking.py
          rtk python3 -m mypy tools/codex_assets/knowledge_hub/index_plan_cli.py tools/codex_assets/knowledge_hub/index_plan_support.py tools/codex_assets/knowledge_hub/index_plan_review_queue.py tools/codex_assets/knowledge_hub/index_plan_review_forms.py tools/codex_assets/knowledge_hub/index_plan_manifest.py tools/codex_assets/knowledge_hub/index_plan_linking.py
          rtk python3 -m pytest -q tests/test_review_queue_sla.py tests/test_cli_help.py tests/test_complexity_budget.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/codex_assets/knowledge_hub/index_plan_cli.py
          git commit -m 'fix(index-plan): preserve direct script imports'
          git push origin HEAD:codex/legacy-burndown-index-plan-v1
