name: Index Plan Split Migration

on:
  push:
    branches:
      - codex/legacy-burndown-index-plan-v1

permissions:
  contents: write

jobs:
  migrate:
    if: "${{ !contains(github.event.head_commit.message, 'refactor(index-plan): split review and audit domains') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Bootstrap governed CI transport
        run: tools/ci/rtk bash tools/ci/bootstrap-path.sh
      - name: Install hash-locked dependencies
        run: rtk python3 -m pip install --require-hashes -r requirements-dev.lock
      - name: Capture baseline behavior
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/index-plan-before
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --json > /tmp/index-plan-before/all.json
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --summary-json > /tmp/index-plan-before/summary.json
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --section source --json > /tmp/index-plan-before/source.json
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --section manifest --json > /tmp/index-plan-before/manifest.json
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --section linking --json > /tmp/index-plan-before/linking.json
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --section review-queue --queue-limit 5 --json > /tmp/index-plan-before/review.json
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --section review-queue --queue-limit 5 --queue-forms-jsonl > /tmp/index-plan-before/forms.jsonl
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --section status > /tmp/index-plan-before/status.txt
      - name: Split index plan domains
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path

          path = Path('tools/codex_assets/knowledge_hub/index_plan_cli.py')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines(keepends=True)
          tree = ast.parse(text)
          funcs = {
              node.name: node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }

          def func_text(name):
              node = funcs[name]
              return ''.join(lines[node.lineno - 1:node.end_lineno])

          def ranges_for(names):
              return [(funcs[name].lineno, funcs[name].end_lineno) for name in names]

          support_names = [
              'emit_json', 'user_path_prefixes', 'display_path',
              'is_local_manifest_draft', 'repository_file_sha256',
              'select_source_coverage_closeout', 'read_json_array', 'read_jsonl',
          ]
          support = '''"""Shared helpers for the index-plan CLI."""\n\nimport datetime as dt\nimport hashlib\nimport json\nimport os\nimport pathlib\nimport re\n\nSOURCE_COVERAGE_RE = re.compile(r"^knowledge-hub-source-coverage-closeout-(\\d{8})\\.jsonl$")\n\n'''
          for name in support_names:
              block = func_text(name)
              if name == 'repository_file_sha256':
                  block = block.replace('def repository_file_sha256(relative_path):', 'def repository_file_sha256(root, relative_path):', 1)
              elif name == 'read_json_array':
                  block = block.replace('def read_json_array(path, key):', 'def read_json_array(root, errors, path, key):', 1)
              elif name == 'read_jsonl':
                  block = block.replace('def read_jsonl(path, label):', 'def read_jsonl(root, errors, path, label):', 1)
              support += block + '\n'
          Path('tools/codex_assets/knowledge_hub/index_plan_support.py').write_text(support, encoding='utf-8')

          queue_names = [
              'first_present_field', 'is_blank', 'as_list', 'review_priority_for_item',
              'source_looks_external', 'make_review_queue_item', 'make_external_source_queue_item',
              'build_review_queue_view', 'build_review_queue_command', 'make_review_queue_form',
          ]
          queue = '''"""Review-queue projection helpers for index-plan."""\n\nimport argparse\nimport collections\nimport pathlib\n\nREVIEW_CONTENT_BOUND_DECISIONS = {"accept-as-review-record", "archive-only", "reject"}\n\nroot = pathlib.Path(".")\nargs = argparse.Namespace()\n\ndef _unconfigured_file_sha256(relative_path):\n    return ""\n\nrepository_file_sha256 = _unconfigured_file_sha256\n\ndef configure_review_queue(root_value, args_value, file_sha256):\n    global root, args, repository_file_sha256\n    root = root_value\n    args = args_value\n    repository_file_sha256 = file_sha256\n\n'''
          for name in queue_names:
              queue += func_text(name) + '\n'
          Path('tools/codex_assets/knowledge_hub/index_plan_review_queue.py').write_text(queue, encoding='utf-8')

          forms_names = [
              'is_nonempty_string', 'make_queue_form_diagnostic', 'resolve_input_path',
              'validate_review_queue_forms', 'apply_review_queue_filters',
          ]
          constants_start = next(i for i, line in enumerate(lines, 1) if line.startswith('REVIEW_QUEUE_FORM_DECISIONS ='))
          constants_end = funcs['is_nonempty_string'].lineno - 1
          forms_constants = ''.join(lines[constants_start - 1:constants_end])
          forms = '''"""Human review form validation and filtering for index-plan."""\n\nimport argparse\nimport collections\nimport datetime as dt\nimport json\nimport pathlib\nimport re\n\nfrom .index_plan_review_queue import build_review_queue_command\n\nSHA256_RE = re.compile(r"^[0-9a-f]{64}$")\nroot = pathlib.Path(".")\nargs = argparse.Namespace()\nreview_sla_date = dt.date.today()\n\ndef configure_review_forms(root_value, args_value, review_sla_date_value):\n    global root, args, review_sla_date\n    root = root_value\n    args = args_value\n    review_sla_date = review_sla_date_value\n\n'''
          forms += forms_constants + '\n'
          for name in forms_names:
              forms += func_text(name) + '\n'
          Path('tools/codex_assets/knowledge_hub/index_plan_review_forms.py').write_text(forms, encoding='utf-8')

          manifest = '''"""Manifest classification helpers for index-plan."""\n\n'''
          manifest += func_text('manifest_profile_health') + '\n'
          classify = func_text('classify_unpaired_manifest')
          classify = classify.replace(
              'def classify_unpaired_manifest(stem, has_jsonl, has_md):',
              'def classify_unpaired_manifest(root, stem, has_jsonl, has_md):',
              1,
          )
          manifest += classify + '\n'
          Path('tools/codex_assets/knowledge_hub/index_plan_manifest.py').write_text(manifest, encoding='utf-8')

          linking = '''"""Cross-index recovery audit for index-plan."""\n\n'''
          relative = func_text('read_relative_text').replace(
              'def read_relative_text(relative_path):',
              'def read_relative_text(root, warnings, relative_path):',
              1,
          )
          linking += relative + '\n'
          audit = func_text('build_linking_audit').replace(
              'def build_linking_audit():',
              'def build_linking_audit(root, warnings, by_project, by_source, by_topic, decisions, by_decision, items, sources, topics):',
              1,
          )
          audit = audit.replace('read_relative_text(spec["path"])', 'read_relative_text(root, warnings, spec["path"])')
          linking += audit + '\n'
          Path('tools/codex_assets/knowledge_hub/index_plan_linking.py').write_text(linking, encoding='utf-8')

          remove_ranges = []
          remove_ranges += ranges_for(support_names)
          remove_ranges += ranges_for(queue_names)
          remove_ranges += ranges_for(forms_names)
          remove_ranges += ranges_for(['manifest_profile_health', 'classify_unpaired_manifest', 'read_relative_text', 'build_linking_audit'])
          remove_ranges.append((constants_start, constants_end))
          remove_lines = set()
          for start, end in remove_ranges:
              remove_lines.update(range(start, end + 1))
          for literal in [
              'SOURCE_COVERAGE_RE = ',
              'SHA256_RE = ',
              'REVIEW_CONTENT_BOUND_DECISIONS = ',
          ]:
              for i, line in enumerate(lines, 1):
                  if line.startswith(literal):
                      remove_lines.add(i)
          for i, line in enumerate(lines, 1):
              if line == 'import hashlib\n':
                  remove_lines.add(i)

          main = ''.join(line for i, line in enumerate(lines, 1) if i not in remove_lines)
          import_anchor = 'import sys\n'
          imports = '''import sys\n\nfrom .index_plan_linking import build_linking_audit\nfrom .index_plan_manifest import classify_unpaired_manifest, manifest_profile_health\nfrom .index_plan_review_forms import apply_review_queue_filters, configure_review_forms, validate_review_queue_forms\nfrom .index_plan_review_queue import (\n    as_list,\n    build_review_queue_view,\n    configure_review_queue,\n    first_present_field,\n    make_review_queue_form,\n)\nfrom .index_plan_support import (\n    display_path,\n    emit_json,\n    is_local_manifest_draft,\n    read_json_array,\n    read_jsonl,\n    repository_file_sha256,\n    select_source_coverage_closeout,\n)\n'''
          if main.count(import_anchor) != 1:
              raise SystemExit('unexpected import anchor count')
          main = main.replace(import_anchor, imports, 1)

          main = main.replace('read_json_array(sources_path, "sources")', 'read_json_array(root, errors, sources_path, "sources")')
          main = main.replace('read_json_array(projects_path, "projects")', 'read_json_array(root, errors, projects_path, "projects")')
          main = main.replace('read_json_array(topics_path, "topics")', 'read_json_array(root, errors, topics_path, "topics")')
          main = main.replace('read_jsonl(root / "registry" / "retired-sources.jsonl", "registry/retired-sources.jsonl")', 'read_jsonl(root, errors, root / "registry" / "retired-sources.jsonl", "registry/retired-sources.jsonl")')
          main = main.replace('read_jsonl(decisions_path, "registry/decisions.jsonl")', 'read_jsonl(root, errors, decisions_path, "registry/decisions.jsonl")')
          main = main.replace('read_jsonl(latest_coverage, str(latest_coverage.relative_to(root)))', 'read_jsonl(root, errors, latest_coverage, str(latest_coverage.relative_to(root)))')
          main = main.replace('read_jsonl(worksheet_path, str(worksheet_path.relative_to(root)))', 'read_jsonl(root, errors, worksheet_path, str(worksheet_path.relative_to(root)))')
          main = main.replace('read_jsonl(manifest_path, str(manifest_path.relative_to(root)))', 'read_jsonl(root, errors, manifest_path, str(manifest_path.relative_to(root)))')
          main = main.replace('classify_unpaired_manifest(stem, stem in manifest_jsonl_stems, stem in manifest_md_stems)', 'classify_unpaired_manifest(root, stem, stem in manifest_jsonl_stems, stem in manifest_md_stems)')
          main = main.replace('linking_audit = build_linking_audit()', 'linking_audit = build_linking_audit(root, warnings, by_project, by_source, by_topic, decisions, by_decision, items, sources, topics)')

          config_anchor = 'if args.validate_queue_forms and not args.json:\n    parser.error("--validate-queue-forms requires --json")\n'
          config = config_anchor + '\nconfigure_review_queue(\n    root,\n    args,\n    lambda relative_path: repository_file_sha256(root, relative_path),\n)\nconfigure_review_forms(root, args, review_sla_date)\n'
          if main.count(config_anchor) != 1:
              raise SystemExit('unexpected config anchor count')
          main = main.replace(config_anchor, config, 1)
          path.write_text(main, encoding='utf-8')
          PY
          rtk python3 -m compileall -q tools/codex_assets/knowledge_hub/index_plan_*.py
          rtk python3 -m ruff check tools/codex_assets/knowledge_hub/index_plan_cli.py tools/codex_assets/knowledge_hub/index_plan_support.py tools/codex_assets/knowledge_hub/index_plan_review_queue.py tools/codex_assets/knowledge_hub/index_plan_review_forms.py tools/codex_assets/knowledge_hub/index_plan_manifest.py tools/codex_assets/knowledge_hub/index_plan_linking.py
          rtk python3 -m mypy tools/codex_assets/knowledge_hub/index_plan_cli.py tools/codex_assets/knowledge_hub/index_plan_support.py tools/codex_assets/knowledge_hub/index_plan_review_queue.py tools/codex_assets/knowledge_hub/index_plan_review_forms.py tools/codex_assets/knowledge_hub/index_plan_manifest.py tools/codex_assets/knowledge_hub/index_plan_linking.py
      - name: Verify behavioral identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/index-plan-after
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --json > /tmp/index-plan-after/all.json
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --summary-json > /tmp/index-plan-after/summary.json
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --section source --json > /tmp/index-plan-after/source.json
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --section manifest --json > /tmp/index-plan-after/manifest.json
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --section linking --json > /tmp/index-plan-after/linking.json
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --section review-queue --queue-limit 5 --json > /tmp/index-plan-after/review.json
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --section review-queue --queue-limit 5 --queue-forms-jsonl > /tmp/index-plan-after/forms.jsonl
          rtk bash tools/knowledge-index-plan.sh --as-of 2026-09-13 --section status > /tmp/index-plan-after/status.txt
          for name in all.json summary.json source.json manifest.json linking.json review.json forms.jsonl status.txt; do
            cmp "/tmp/index-plan-before/$name" "/tmp/index-plan-after/$name"
          done
      - name: Commit candidate and verify tracked complexity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/codex_assets/knowledge_hub/index_plan_cli.py \
            tools/codex_assets/knowledge_hub/index_plan_support.py \
            tools/codex_assets/knowledge_hub/index_plan_review_queue.py \
            tools/codex_assets/knowledge_hub/index_plan_review_forms.py \
            tools/codex_assets/knowledge_hub/index_plan_manifest.py \
            tools/codex_assets/knowledge_hub/index_plan_linking.py
          git commit -m 'refactor(index-plan): split review and audit domains'
          rtk python3 - <<'PY'
          from pathlib import Path
          from tools.codex_assets.knowledge_hub.common import repository_root
          from tools.codex_assets.knowledge_hub.complexity_budget import evaluate_complexity_budget

          root = repository_root()
          paths = [
              'tools/codex_assets/knowledge_hub/index_plan_cli.py',
              'tools/codex_assets/knowledge_hub/index_plan_support.py',
              'tools/codex_assets/knowledge_hub/index_plan_review_queue.py',
              'tools/codex_assets/knowledge_hub/index_plan_review_forms.py',
              'tools/codex_assets/knowledge_hub/index_plan_manifest.py',
              'tools/codex_assets/knowledge_hub/index_plan_linking.py',
          ]
          for rel in paths:
              count = len((root / rel).read_text(encoding='utf-8').splitlines())
              print(f'{rel}: {count}')
              if count > 800:
                  raise SystemExit(f'{rel} exceeds 800 lines')
          report = evaluate_complexity_budget(root)
          print(f'oversized_module_count={report["oversized_module_count"]}')
          print(f'regressions={report["regressions"]}')
          if report['status'] != 'pass':
              raise SystemExit('complexity budget failed')
          if report['oversized_module_count'] != 2:
              raise SystemExit(f'expected oversized count 2, got {report["oversized_module_count"]}')
          PY
          rtk python3 -m pytest -q tests/test_complexity_budget.py tests/test_cli_help.py
          git push origin HEAD:codex/legacy-burndown-index-plan-v1
