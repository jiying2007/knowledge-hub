name: ai-maintenance-sweep

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-maintenance-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: AI-first health, review and growth sweep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up governed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-runtime.lock

      - name: Bootstrap governed CI transport
        run: tools/ci/rtk bash tools/ci/bootstrap-path.sh

      - name: Install hash-locked runtime dependencies
        run: rtk python3 -m pip install --require-hashes -r requirements-runtime.lock

      - name: Capture health and review risk
        run: |
          set -uo pipefail
          mkdir -p .cache/knowledge-hub/ai-maintenance
          set +e
          rtk bash tools/knowledge-health-summary.sh --json \
            > .cache/knowledge-hub/ai-maintenance/health.json
          health_rc=$?
          rtk bash tools/knowledge-review-after.sh --window-days 30 --json \
            > .cache/knowledge-hub/ai-maintenance/review-after.json
          review_rc=$?
          set -e
          printf '%s\n' "${health_rc}" > .cache/knowledge-hub/ai-maintenance/health-exit-code.txt
          printf '%s\n' "${review_rc}" > .cache/knowledge-hub/ai-maintenance/review-exit-code.txt
          [[ "${health_rc}" -eq 0 || "${health_rc}" -eq 1 ]] || exit "${health_rc}"
          [[ "${review_rc}" -eq 0 || "${review_rc}" -eq 1 ]] || exit "${review_rc}"
          test -s .cache/knowledge-hub/ai-maintenance/health.json
          test -s .cache/knowledge-hub/ai-maintenance/review-after.json
          rtk python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ("health.json", "review-after.json"):
              json.loads((Path(".cache/knowledge-hub/ai-maintenance") / name).read_text(encoding="utf-8"))
          PY

      - name: Capture data growth budget
        run: |
          set -euo pipefail
          rtk python3 - <<'PY'
          import json
          import pathlib
          from tools.codex_assets.knowledge_hub.complexity_budget import evaluate_complexity_budget

          report = evaluate_complexity_budget(pathlib.Path(".").resolve())
          pathlib.Path(".cache/knowledge-hub/ai-maintenance/data-growth.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build bounded AI maintenance decision
        id: decision
        run: |
          set -euo pipefail
          rtk python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(".cache/knowledge-hub/ai-maintenance")
          review = json.loads((root / "review-after.json").read_text(encoding="utf-8"))
          growth = json.loads((root / "data-growth.json").read_text(encoding="utf-8"))
          health = json.loads((root / "health.json").read_text(encoding="utf-8"))

          rows = [row for row in review.get("rows", []) if isinstance(row, dict)]
          security_stale = sum(
              1
              for row in rows
              if row.get("row_type") == "stale_item"
              and row.get("review_class") == "security-critical"
          )
          governance_stale = sum(
              1
              for row in rows
              if row.get("row_type") == "stale_item"
              and row.get("review_class") == "governance-critical"
          )
          ordinary_stale = sum(
              1
              for row in rows
              if row.get("row_type") == "stale_item"
              and row.get("review_class") == "ordinary"
          )
          hard_cap = sum(
              1
              for row in growth.get("regressions", [])
              if isinstance(row, dict) and row.get("type") == "data-growth-hard-cap"
          )
          policy_error = bool(review.get("errors")) or growth.get("status") == "fail"
          human_required = bool(security_stale or hard_cap or policy_error)
          summary = {
              "schema_version": 1,
              "projection": "knowledge-hub-ai-maintenance-v1",
              "health_status": health.get("status", "unknown"),
              "security_critical_stale_count": security_stale,
              "governance_critical_stale_count": governance_stale,
              "ordinary_stale_count": ordinary_stale,
              "data_growth_hard_cap_count": hard_cap,
              "data_growth_segment_candidate_count": int(
                  growth.get("data_growth_attention_count", 0) or 0
              ),
              "human_required": human_required,
              "ordinary_and_governance_routed_to_ai": True,
              "canonical_write_performed": False,
          }
          (root / "summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write("human_required={}\n".format(str(human_required).lower()))
              handle.write("security_stale={}\n".format(security_stale))
              handle.write("hard_cap={}\n".format(hard_cap))
          PY

      - name: Route only critical maintenance to a human
        if: steps.decision.outputs.human_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SECURITY_STALE: ${{ steps.decision.outputs.security_stale }}
          HARD_CAP: ${{ steps.decision.outputs.hard_cap }}
        run: |
          set -euo pipefail
          title="AI maintenance: critical human decision required"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          number="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --limit 100 \
            --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)"
          body="AI maintenance completed. security-critical stale=${SECURITY_STALE}, data-growth hard-cap=${HARD_CAP}. Ordinary/governance review items remain machine-owned. Review the bounded evidence artifact: ${run_url}."
          if [[ -n "${number}" ]]; then
            gh issue comment "${number}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "${body}"
          fi

      - name: Close stale critical maintenance issue when recovered
        if: steps.decision.outputs.human_required == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="AI maintenance: critical human decision required"
          number="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --limit 100 \
            --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)"
          if [[ -n "${number}" ]]; then
            gh issue close "${number}" --repo "${GITHUB_REPOSITORY}" \
              --comment "Fresh AI maintenance sweep no longer requires a critical human decision; closing the stale queue item automatically."
          fi

      - name: Upload bounded maintenance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knowledge-hub-ai-maintenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/knowledge-hub/ai-maintenance/
          if-no-files-found: error
          retention-days: 30
