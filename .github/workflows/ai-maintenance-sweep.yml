name: ai-maintenance-sweep

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-maintenance-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: AI-first health, review and growth sweep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up governed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-runtime.lock

      - name: Bootstrap governed CI transport
        run: tools/ci/rtk bash tools/ci/bootstrap-path.sh

      - name: Install hash-locked runtime dependencies
        run: rtk python3 -m pip install --require-hashes -r requirements-runtime.lock

      - name: Capture health and review risk
        run: |
          set -uo pipefail
          mkdir -p .cache/knowledge-hub/ai-maintenance
          set +e
          rtk bash tools/knowledge-health-summary.sh --json \
            > .cache/knowledge-hub/ai-maintenance/health.json
          health_rc=$?
          rtk bash tools/knowledge-review-after.sh --window-days 30 --json \
            > .cache/knowledge-hub/ai-maintenance/review-after.json
          review_rc=$?
          set -e
          printf '%s\n' "${health_rc}" > .cache/knowledge-hub/ai-maintenance/health-exit-code.txt
          printf '%s\n' "${review_rc}" > .cache/knowledge-hub/ai-maintenance/review-exit-code.txt
          [[ "${health_rc}" -eq 0 || "${health_rc}" -eq 1 ]] || exit "${health_rc}"
          [[ "${review_rc}" -eq 0 || "${review_rc}" -eq 1 ]] || exit "${review_rc}"
          test -s .cache/knowledge-hub/ai-maintenance/health.json
          test -s .cache/knowledge-hub/ai-maintenance/review-after.json
          rtk python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ("health.json", "review-after.json"):
              json.loads((Path(".cache/knowledge-hub/ai-maintenance") / name).read_text(encoding="utf-8"))
          PY

      - name: Capture data growth budget
        run: |
          set -euo pipefail
          rtk python3 - <<'PY'
          import json
          import pathlib
          from tools.codex_assets.knowledge_hub.complexity_budget import evaluate_complexity_budget

          report = evaluate_complexity_budget(pathlib.Path(".").resolve())
          pathlib.Path(".cache/knowledge-hub/ai-maintenance/data-growth.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Materialize machine triage and governance review packet
        run: |
          set -euo pipefail
          rtk python3 - <<'PY'
          import json
          from pathlib import Path

          from tools.codex_assets.knowledge_hub.maintenance_triage import (
              build_maintenance_triage,
          )

          root = Path(".cache/knowledge-hub/ai-maintenance")
          review = json.loads((root / "review-after.json").read_text(encoding="utf-8"))
          growth = json.loads((root / "data-growth.json").read_text(encoding="utf-8"))
          health = json.loads((root / "health.json").read_text(encoding="utf-8"))
          triage, packet = build_maintenance_triage(review, growth, health)
          (root / "triage-receipt.json").write_text(
              json.dumps(triage, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          (root / "governance-review-packet.json").write_text(
              json.dumps(packet, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Materialize owner qualification packet
        id: owner_packet
        run: |
          set -euo pipefail
          rtk python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          from tools.codex_assets.knowledge_hub.common import repository_root
          from tools.codex_assets.knowledge_hub.owner_qualification_packet import (
              build_owner_qualification_packet,
          )
          from tools.codex_assets.knowledge_hub.schemas import validate_instance

          root = repository_root()
          packet = build_owner_qualification_packet(root)
          validation = validate_instance(
              root,
              "owner-qualification-packet-v1",
              packet,
          )
          if validation.get("status") != "pass":
              raise SystemExit(
                  "owner qualification packet failed schema: {}".format(
                      validation.get("errors", [])
                  )
              )
          output = Path(
              ".cache/knowledge-hub/ai-maintenance/owner-qualification-packet.json"
          )
          output.write_text(
              json.dumps(packet, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(
                  "fingerprint={}\n".format(packet["packet_fingerprint"])
              )
              handle.write(
                  "owner_declaration_pending={}\n".format(
                      packet["owner_declaration_pending_count"]
                  )
              )
              handle.write(
                  "owner_boundary_pending={}\n".format(
                      packet["owner_boundary_pending_count"]
                  )
              )
              handle.write(
                  "real_evidence_pending={}\n".format(
                      packet["real_evidence_pending_project_count"]
                  )
              )
              handle.write(
                  "qualification_pass={}\n".format(
                      str(packet["qualification_pass"]).lower()
                  )
              )
          PY

      - name: Build bounded AI maintenance decision
        id: decision
        run: |
          set -euo pipefail
          rtk python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(".cache/knowledge-hub/ai-maintenance")
          review = json.loads((root / "review-after.json").read_text(encoding="utf-8"))
          growth = json.loads((root / "data-growth.json").read_text(encoding="utf-8"))
          health = json.loads((root / "health.json").read_text(encoding="utf-8"))

          triage = json.loads(
              (root / "triage-receipt.json").read_text(encoding="utf-8")
          )
          packet = json.loads(
              (root / "governance-review-packet.json").read_text(encoding="utf-8")
          )
          security_stale = int((triage.get("security") or {}).get("count", 0) or 0)
          governance_stale = int((triage.get("governance") or {}).get("count", 0) or 0)
          ordinary_stale = int((triage.get("ordinary") or {}).get("count", 0) or 0)
          hard_cap = sum(
              1
              for row in growth.get("regressions", [])
              if isinstance(row, dict) and row.get("type") == "data-growth-hard-cap"
          )
          policy_error = bool(review.get("errors")) or growth.get("status") == "fail"
          human_required = bool(security_stale or hard_cap or policy_error)
          summary = {
              "schema_version": 1,
              "projection": "knowledge-hub-ai-maintenance-v1",
              "health_status": health.get("status", "unknown"),
              "security_critical_stale_count": security_stale,
              "governance_critical_stale_count": governance_stale,
              "ordinary_stale_count": ordinary_stale,
              "data_growth_hard_cap_count": hard_cap,
              "data_growth_segment_candidate_count": int(
                  growth.get("data_growth_attention_count", 0) or 0
              ),
              "human_required": human_required,
              "policy_error": policy_error,
              "ordinary_and_governance_routed_to_ai": True,
              "machine_triage_receipt": "triage-receipt.json",
              "governance_review_packet": "governance-review-packet.json",
              "governance_review_packet_status": packet.get("status", "unknown"),
              "canonical_write_performed": False,
          }
          (root / "summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write("human_required={}\n".format(str(human_required).lower()))
              handle.write("security_stale={}\n".format(security_stale))
              handle.write("hard_cap={}\n".format(hard_cap))
              handle.write("policy_error={}\n".format(str(policy_error).lower()))
          PY

      - name: Route only critical maintenance to a human
        if: steps.decision.outputs.human_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SECURITY_STALE: ${{ steps.decision.outputs.security_stale }}
          HARD_CAP: ${{ steps.decision.outputs.hard_cap }}
          POLICY_ERROR: ${{ steps.decision.outputs.policy_error }}
        run: |
          set -euo pipefail
          title="AI maintenance: critical human decision required"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          number="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --limit 100 \
            --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)"
          body="AI maintenance completed. security-critical stale=${SECURITY_STALE}, data-growth hard-cap=${HARD_CAP}, policy-error=${POLICY_ERROR}. Ordinary stale items have a machine triage receipt and governance-critical items have a bounded review packet. Review the bounded evidence artifact: ${run_url}."
          if [[ -n "${number}" ]]; then
            gh issue comment "${number}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "${body}"
          fi

      - name: Close stale critical maintenance issue when recovered
        if: steps.decision.outputs.human_required == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="AI maintenance: critical human decision required"
          number="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --limit 100 \
            --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)"
          if [[ -n "${number}" ]]; then
            gh issue close "${number}" --repo "${GITHUB_REPOSITORY}" \
              --comment "Fresh AI maintenance sweep no longer requires a critical human decision; closing the stale queue item automatically."
          fi

      - name: Reconcile operational qualification trackers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rtk python3 - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(
              Path("registry/knowledge-platform-p5-p10.json").read_text(
                  encoding="utf-8"
              )
          )
          gaps = {
              str(row.get("id", "")): str(row.get("status", ""))
              for row in registry.get("external_closure_gaps", [])
              if isinstance(row, dict)
          }
          Path(".cache/knowledge-hub/ai-maintenance/operational-trackers.json").write_text(
              json.dumps(
                  {
                      "connector_provider_pilot_closed": (
                          gaps.get("connector-provider-pilot") == "closed"
                      ),
                      "production_bundle_closed": all(
                          gaps.get(name) == "closed"
                          for name in (
                              "production-retrieval-eval",
                              "memory-lifecycle-pilot",
                              "real-adoption-evidence",
                          )
                      ),
                  },
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

          connector_closed="$(jq -r '.connector_provider_pilot_closed' .cache/knowledge-hub/ai-maintenance/operational-trackers.json)"
          production_closed="$(jq -r '.production_bundle_closed' .cache/knowledge-hub/ai-maintenance/operational-trackers.json)"

          if [[ "${connector_closed}" == "true" ]]; then
            state="$(gh issue view 20 --repo "${GITHUB_REPOSITORY}" --json state --jq .state 2>/dev/null || true)"
            if [[ "${state}" == "OPEN" ]]; then
              gh issue close 20 --repo "${GITHUB_REPOSITORY}" \
                --comment "Canonical connector-provider-pilot is closed by strict real external evidence; closing the stale operational qualification tracker automatically."
            fi
          fi

          if [[ "${production_closed}" == "true" ]]; then
            state="$(gh issue view 21 --repo "${GITHUB_REPOSITORY}" --json state --jq .state 2>/dev/null || true)"
            if [[ "${state}" == "OPEN" ]]; then
              gh issue close 21 --repo "${GITHUB_REPOSITORY}" \
                --comment "Canonical production retrieval, memory lifecycle, and real adoption gaps are all closed by strict real evidence; closing the stale operational qualification tracker automatically."
            fi
          fi

      - name: Reconcile owner and project qualification trackers
        env:
          GH_TOKEN: ${{ github.token }}
          PACKET_FINGERPRINT: ${{ steps.owner_packet.outputs.fingerprint }}
          OWNER_DECLARATION_PENDING: ${{ steps.owner_packet.outputs.owner_declaration_pending }}
          OWNER_BOUNDARY_PENDING: ${{ steps.owner_packet.outputs.owner_boundary_pending }}
          REAL_EVIDENCE_PENDING: ${{ steps.owner_packet.outputs.real_evidence_pending }}
          QUALIFICATION_PASS: ${{ steps.owner_packet.outputs.qualification_pass }}
        run: |
          set -euo pipefail
          packet=".cache/knowledge-hub/ai-maintenance/owner-qualification-packet.json"
          test -s "${packet}"

          owner_declarations="$(jq -r '.owner_declaration_projects | join(", ")' "${packet}")"
          owner_boundaries="$(jq -r '.owner_boundary_projects | join(", ")' "${packet}")"
          real_evidence="$(jq -r '.real_evidence_projects | join(", ")' "${packet}")"

          issue_state() {
            gh issue view "$1" --repo "${GITHUB_REPOSITORY}" --json state --jq .state
          }

          comment_once() {
            local issue="$1"
            local body="$2"
            local seen
            seen="$(
              gh issue view "${issue}" --repo "${GITHUB_REPOSITORY}" \
                --json comments \
                --jq ".comments[] | select(.body | contains(\"${PACKET_FINGERPRINT}\")) | .url" \
              | head -n 1
            )"
            if [[ -z "${seen}" ]]; then
              gh issue comment "${issue}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
            fi
          }

          owner_gate_ready=false
          if [[ "${OWNER_DECLARATION_PENDING}" == "0" && "${OWNER_BOUNDARY_PENDING}" == "0" ]]; then
            owner_gate_ready=true
          fi

          state74="$(issue_state 74)"
          if [[ "${owner_gate_ready}" == "true" ]]; then
            if [[ "${state74}" == "OPEN" ]]; then
              gh issue close 74 --repo "${GITHUB_REPOSITORY}" \
                --comment "Fresh canonical owner qualification packet ${PACKET_FINGERPRINT} has zero owner-declaration and owner-boundary pending projects. Closing the stale owner gate tracker; no owner decision was generated by automation."
            fi
          else
            if [[ "${state74}" == "CLOSED" ]]; then
              gh issue reopen 74 --repo "${GITHUB_REPOSITORY}" \
                --comment "Fresh canonical owner qualification regressed; reopening the owner gate tracker."
            fi
            body74="Fresh deterministic owner packet ${PACKET_FINGERPRINT}. owner_declaration_pending=${OWNER_DECLARATION_PENDING} [${owner_declarations}]; owner_boundary_pending=${OWNER_BOUNDARY_PENDING} [${owner_boundaries}]. This packet is read-only and does not infer or generate owner approval."
            comment_once 74 "${body74}"
          fi

          state96="$(issue_state 96)"
          if [[ "${QUALIFICATION_PASS}" == "true" ]]; then
            if [[ "${state96}" == "OPEN" ]]; then
              gh issue close 96 --repo "${GITHUB_REPOSITORY}" \
                --comment "Fresh canonical owner/project qualification packet ${PACKET_FINGERPRINT} reports PASS. Closing the stale qualification tracker automatically."
            fi
          else
            if [[ "${state96}" == "CLOSED" ]]; then
              gh issue reopen 96 --repo "${GITHUB_REPOSITORY}" \
                --comment "Fresh canonical project qualification regressed; reopening the tracker."
            fi
            body96="Fresh deterministic qualification packet ${PACKET_FINGERPRINT}: owner declarations pending=${OWNER_DECLARATION_PENDING}; owner boundaries pending=${OWNER_BOUNDARY_PENDING}; real-evidence pending projects=${REAL_EVIDENCE_PENDING} [${real_evidence}]. No project readiness, owner decision, or real-world evidence was synthesized."
            comment_once 96 "${body96}"
          fi

      - name: Upload bounded maintenance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knowledge-hub-ai-maintenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/knowledge-hub/ai-maintenance/
          if-no-files-found: error
          retention-days: 30
