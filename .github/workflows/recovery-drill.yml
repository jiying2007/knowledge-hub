name: quarterly-recovery-drill

on:
  schedule:
    - cron: "23 3 1 */3 *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-drill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover:
    name: Restore committed HEAD in a GitHub-hosted runner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout immutable remote revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up governed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Bootstrap governed CI transport
        run: tools/ci/rtk bash tools/ci/bootstrap-path.sh
      - name: Install hash-locked dependencies
        run: rtk python3 -m pip install --require-hashes -r requirements-dev.lock
      - name: Run full engineering gate
        run: rtk python3 -m tools.codex_assets.knowledge_hub.engineering_cli --mode full --summary-json
      - name: Restore and validate committed HEAD
        run: rtk bash tools/knowledge-restore-drill.sh --source-mode head --summary-json
      - name: Bind product gate to the same recovery run
        run: rtk bash tools/knowledge-final-gate.sh --final-profile product --regression-suite full --reuse-engineering-evidence --summary-json
      - name: Upload immutable recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knowledge-hub-quarterly-recovery-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/engineering/knowledge-hub.cdx.json
            .cache/knowledge-hub/engineering-quality.json
            .cache/knowledge-hub/restore-drill-head.json
            .cache/knowledge-hub/final-gate-product-full.json
          if-no-files-found: error
          retention-days: 90
