name: Search Burn-down Bootstrap

on:
  push:
    branches:
      - codex/legacy-burndown-search-v1

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Split search behind a compatibility facade
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/search_burndown_bootstrap.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(search): split cache index and query runtime'
          git push origin HEAD:codex/legacy-burndown-search-v1
