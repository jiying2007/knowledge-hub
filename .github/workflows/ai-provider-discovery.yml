name: ai-provider-discovery

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-provider-discovery
  cancel-in-progress: false

jobs:
  discover:
    name: Build machine-only provider review bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up governed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-runtime.lock

      - name: Bootstrap governed CI transport
        run: tools/ci/rtk bash tools/ci/bootstrap-path.sh

      - name: Install hash-locked runtime dependencies
        run: rtk python3 -m pip install --require-hashes -r requirements-runtime.lock

      - name: Discover, qualify and auto-review unique candidates
        id: discover
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p .cache/knowledge-hub/ai-provider-discovery
          set +e
          rtk python3 -m tools.codex_assets.knowledge_hub.operator_provider_cli \
            --auto-review-unique --json \
            > .cache/knowledge-hub/ai-provider-discovery/review-bundle.json
          rc=$?
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          test -s .cache/knowledge-hub/ai-provider-discovery/review-bundle.json
          rtk python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path(".cache/knowledge-hub/ai-provider-discovery/review-bundle.json").read_text(
                  encoding="utf-8"
              )
          )
          allowed = {
              "needs-governed-authorization",
              "no-change",
              "ambiguous",
              "blocked",
          }
          status = str(payload.get("status", ""))
          if status not in allowed:
              raise SystemExit("unexpected AI provider discovery status: {}".format(status))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write("status={}\n".format(status))
              handle.write(
                  "selected={}\n".format(
                      int(payload.get("selected_proposal_count", 0) or 0)
                  )
              )
          PY

      - name: Route only final authorization to a human
        if: steps.discover.outputs.status == 'needs-governed-authorization'
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED: ${{ steps.discover.outputs.selected }}
        run: |
          set -euo pipefail
          title="AI evidence binding: governed authorization pending"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          number="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --limit 100 \
            --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)"
          body="AI discovery/qualification completed without canonical writes. ${SELECTED} unambiguous proposal target(s) reached the existing governed-authorization boundary. Review the bounded workflow artifact: ${run_url}. Selection is explicitly not authorization; device/production/owner evidence was not fabricated."
          if [[ -n "${number}" ]]; then
            gh issue comment "${number}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "${body}"
          fi

      - name: Keep ambiguous or blocked discovery machine-owned
        if: steps.discover.outputs.status == 'ambiguous' || steps.discover.outputs.status == 'blocked'
        run: |
          set -euo pipefail
          echo "Machine discovery remained ambiguous/blocked. No human authorization request was created."
          echo "The next scheduled run will retry from fresh canonical/provider state."

      - name: Close stale authorization issue when fresh state no longer needs it
        if: steps.discover.outputs.status != 'needs-governed-authorization'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_STATUS: ${{ steps.discover.outputs.status }}
        run: |
          set -euo pipefail
          title="AI evidence binding: governed authorization pending"
          number="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --limit 100 \
            --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)"
          if [[ -n "${number}" ]]; then
            gh issue close "${number}" --repo "${GITHUB_REPOSITORY}" \
              --comment "Fresh AI provider state is ${CURRENT_STATUS}; the previous authorization packet is stale and is closed automatically. A future fresh review bundle will reopen the human boundary if needed."
          fi

      - name: Upload bounded discovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knowledge-hub-ai-provider-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/knowledge-hub/ai-provider-discovery/
          if-no-files-found: error
          retention-days: 30
