name: Status Split Source Map

on:
  push:
    branches:
      - codex/legacy-burndown-status-v1

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Map top-level structure and retire probe
        shell: bash
        run: |
          set -euo pipefail
          tools/ci/rtk python3 - <<'PY'
          import ast
          from pathlib import Path

          path = Path('tools/codex_assets/knowledge_hub/status_cli.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source)
          print(f'STATUS_LINES={len(source.splitlines())}')
          print('TOP_LEVEL_NODES')
          total_function_lines = 0
          for node in tree.body:
              start = getattr(node, 'lineno', 0)
              end = getattr(node, 'end_lineno', start)
              span = end - start + 1 if start else 0
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  total_function_lines += span
                  print(f'FUNC|{node.name}|{start}|{end}|{span}')
              else:
                  label = type(node).__name__
                  preview = source.splitlines()[start - 1].strip()[:100] if start else ''
                  print(f'NODE|{label}|{start}|{end}|{span}|{preview}')
          print(f'TOTAL_FUNCTION_LINES={total_function_lines}')
          print('FUNCTION_LOAD_NAMES')
          for node in tree.body:
              if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  continue
              locals_ = {arg.arg for arg in node.args.args + node.args.kwonlyargs}
              locals_.update(
                  child.id
                  for child in ast.walk(node)
                  if isinstance(child, ast.Name) and isinstance(child.ctx, ast.Store)
              )
              loads = sorted({
                  child.id
                  for child in ast.walk(node)
                  if isinstance(child, ast.Name)
                  and isinstance(child.ctx, ast.Load)
                  and child.id not in locals_
              })
              print(f'LOADS|{node.name}|{",".join(loads)}')
          probe = Path('.github/workflows/status-split-source-map.yml')
          probe.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(status): retire split source-map probe'
          git push origin HEAD:codex/legacy-burndown-status-v1
