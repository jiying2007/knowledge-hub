name: signed-quality-attestation

on:
  push:
    branches:
      - master
      - codex/signed-attestation-identity-v1
    paths:
      - ".github/workflows/signed-quality-attestation.yml"
      - "registry/knowledge-platform-p5-p10.json"
      - "registry/terminal-closure.json"
      - "tools/codex_assets/knowledge_hub/attestation.py"
      - "tools/codex_assets/knowledge_hub/signed_attestation.py"
      - "tools/codex_assets/knowledge_hub/signed_attestation_cli.py"
      - "tools/codex_assets/knowledge_hub/terminal_closure.py"
      - "tests/test_connector_observability_attestation.py"
      - "tests/test_signed_attestation.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-quality-attestation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sign-and-verify:
    name: OIDC signed quality attestation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up governed Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Bootstrap governed CI transport
        run: tools/ci/rtk bash tools/ci/bootstrap-path.sh
      - name: Install hash-locked dependencies
        run: rtk python3 -m pip install --require-hashes -r requirements-dev.lock
      - name: Run full engineering gate
        run: rtk python3 -m tools.codex_assets.knowledge_hub.engineering_cli --mode full --json
      - name: Capture deterministic compliance evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/knowledge-hub
          rtk bash tools/knowledge-compliance-eval.sh \
            --root tests/fixtures/agent_compliance_root \
            --cases tests/fixtures/agent_compliance_cases.jsonl \
            --minimum-cases 50 --require-verdict-coverage --json \
            | tee .cache/knowledge-hub/compliance-eval.json
      - name: Verify remote checkout in an offsite runner
        run: rtk bash tools/knowledge-restore-drill.sh --source-mode head --json
      - name: Assess product readiness without terminal overclaim
        run: rtk bash tools/knowledge-final-gate.sh --final-profile product --regression-suite full --reuse-engineering-evidence --json
      - name: Capture fresh remote branch inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: rtk python3 -m tools.codex_assets.knowledge_hub.remote_branch_inventory_cli --repository "${GITHUB_REPOSITORY}" --source-revision "${GITHUB_SHA}"
      - name: Capture actual terminal closure verdict
        shell: bash
        run: |
          set -uo pipefail
          set +e
          rtk python3 -m tools.codex_assets.knowledge_hub.terminal_closure_cli \
            --json --output .cache/knowledge-hub/terminal-closure.json \
            > .cache/knowledge-hub/terminal-closure-command.json
          rc=$?
          set -e
          if [[ "$rc" -ne 0 && "$rc" -ne 2 ]]; then
            cat .cache/knowledge-hub/terminal-closure-command.json
            exit "$rc"
          fi
          test -s .cache/knowledge-hub/terminal-closure.json
      - name: Build bounded quality attestation materials
        run: rtk python3 -m tools.codex_assets.knowledge_hub.signed_attestation_cli build --source-revision "${GITHUB_SHA}"
      - name: Sign custom quality attestation with GitHub OIDC and Sigstore
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .cache/knowledge-hub/signed-attestation/quality-evidence-manifest.json
          predicate-type: https://knowledge-hub.local/attestation/quality/v1
          predicate-path: .cache/knowledge-hub/signed-attestation/quality-predicate.json
      - name: Cryptographically verify signer identity and signed predicate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          signer="${GITHUB_REPOSITORY}/.github/workflows/signed-quality-attestation.yml"
          gh attestation verify \
            .cache/knowledge-hub/signed-attestation/quality-evidence-manifest.json \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type https://knowledge-hub.local/attestation/quality/v1 \
            --signer-workflow "$signer" \
            --source-digest "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF}" \
            --deny-self-hosted-runners \
            --format json \
            > .cache/knowledge-hub/signed-attestation/github-verification.json
          rtk python3 -m tools.codex_assets.knowledge_hub.signed_attestation_cli verify-hosted \
            --source-revision "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF}" \
            --signer-workflow "$signer" \
            --verification .cache/knowledge-hub/signed-attestation/github-verification.json \
            --bundle "$BUNDLE_PATH" \
            --attestation-id "$ATTESTATION_ID" \
            --attestation-url "$ATTESTATION_URL"
      - name: Upload signed quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knowledge-hub-signed-quality-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/knowledge-hub/signed-attestation/
            .cache/knowledge-hub/engineering-quality.json
            .cache/knowledge-hub/compliance-eval.json
            .cache/knowledge-hub/restore-drill-head.json
            .cache/knowledge-hub/final-gate-product-full.json
            .cache/knowledge-hub/remote-branch-inventory.json
            .cache/knowledge-hub/terminal-closure.json
            .tmp/engineering/knowledge-hub.cdx.json
          if-no-files-found: error
          retention-days: 90
