name: signed-quality-attestation

on:
  workflow_run:
    workflows:
      - quality
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sign-and-verify:
    name: OIDC sign exact Quality evidence
    if: >-
      ${{
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'master' &&
         github.workflow_sha == github.event.workflow_run.head_sha) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
      issues: write
    env:
      SOURCE_REVISION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      SOURCE_REF: refs/heads/master
      SIGNER_WORKFLOW_REVISION: ${{ github.workflow_sha }}
      KNOWLEDGE_GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout exact Quality source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false

      - name: Set up governed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-runtime.lock

      - name: Bootstrap governed CI transport
        run: tools/ci/rtk bash tools/ci/bootstrap-path.sh

      - name: Install hash-locked runtime dependencies
        run: rtk python3 -m pip install --require-hashes -r requirements-runtime.lock

      - name: Resolve exact successful Quality run
        id: quality-run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail
          mkdir -p .cache/knowledge-hub/signed-attestation
          if [[ -n "${TRIGGER_RUN_ID}" ]]; then
            run_id="${TRIGGER_RUN_ID}"
          else
            run_id="$(
              gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/runs?branch=master&status=success&per_page=50" \
                --jq '.workflow_runs[] | select(.event == "push") | [.id, .head_sha] | @tsv' \
              | awk -v sha="${SOURCE_REVISION}" '$2 == sha {print $1; exit}'
            )"
          fi
          if [[ ! "${run_id}" =~ ^[0-9]+$ ]]; then
            echo "No successful master Quality run is bound to SOURCE_REVISION=${SOURCE_REVISION}" >&2
            exit 1
          fi
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
            > .cache/knowledge-hub/signed-attestation/quality-source-run.json

      - name: Verify Quality run identity
        env:
          QUALITY_RUN_ID: ${{ steps.quality-run.outputs.run_id }}
        run: |
          set -euo pipefail
          rtk python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(".cache/knowledge-hub/signed-attestation/quality-source-run.json")
          run = json.loads(path.read_text(encoding="utf-8"))
          expected = {
              "id": int(os.environ["QUALITY_RUN_ID"]),
              "head_sha": os.environ["SOURCE_REVISION"],
              "head_branch": "master",
              "event": "push",
              "status": "completed",
              "conclusion": "success",
              "path": ".github/workflows/quality.yml",
          }
          for field, value in expected.items():
              if run.get(field) != value:
                  raise SystemExit(
                      "Quality run identity mismatch for {}: expected={!r} observed={!r}".format(
                          field, value, run.get(field)
                      )
                  )
          repository = run.get("repository") or {}
          if repository.get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("Quality run repository identity mismatch")
          PY

      - name: Download exact Quality evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_RUN_ID: ${{ steps.quality-run.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run download "${QUALITY_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name knowledge-hub-quality-evidence \
            --dir .
          gh run download "${QUALITY_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name knowledge-hub-mcp-conformance \
            --dir .
          test -s .cache/knowledge-hub/quality-evidence-binding.json
          test -s .cache/knowledge-hub/mcp-conformance/evidence.json

      - name: Verify exact-SHA Quality evidence binding
        run: |
          set -euo pipefail
          rtk python3 -m tools.codex_assets.knowledge_hub.quality_evidence_binding_cli \
            verify --source-revision "${SOURCE_REVISION}" --json \
            > .cache/knowledge-hub/signed-attestation/quality-binding-verification.json

      - name: Capture fresh remote branch inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          KNOWLEDGE_SOURCE_REVISION="${SOURCE_REVISION}" \
          rtk python3 -m tools.codex_assets.knowledge_hub.remote_branch_inventory_cli \
            --repository "${GITHUB_REPOSITORY}" \
            --source-revision "${SOURCE_REVISION}"

      - name: Capture fresh hosting posture
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          KNOWLEDGE_SOURCE_REVISION="${SOURCE_REVISION}" \
          rtk python3 -m tools.codex_assets.knowledge_hub.hosting_posture_cli \
            --repository "${GITHUB_REPOSITORY}" \
            --source-revision "${SOURCE_REVISION}"

      - name: Capture actual GitHub repository closure verdict
        shell: bash
        run: |
          set -uo pipefail
          set +e
          KNOWLEDGE_SOURCE_REVISION="${SOURCE_REVISION}" \
          KNOWLEDGE_GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
          rtk python3 -m tools.codex_assets.knowledge_hub.terminal_closure_cli \
            --json --output .cache/knowledge-hub/terminal-closure.json \
            > .cache/knowledge-hub/terminal-closure-command.json
          rc=$?
          set -e
          if [[ "${rc}" -ne 0 && "${rc}" -ne 2 ]]; then
            cat .cache/knowledge-hub/terminal-closure-command.json
            exit "${rc}"
          fi
          test -s .cache/knowledge-hub/terminal-closure.json

      - name: Build bounded quality attestation materials
        run: |
          rtk python3 -m tools.codex_assets.knowledge_hub.signed_attestation_cli \
            build --source-revision "${SOURCE_REVISION}"

      - name: Sign custom quality attestation with GitHub OIDC and Sigstore
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .cache/knowledge-hub/signed-attestation/quality-evidence-manifest.json
          predicate-type: https://knowledge-hub.local/attestation/quality/v1
          predicate-path: .cache/knowledge-hub/signed-attestation/quality-predicate.json

      - name: Cryptographically verify signer identity and signed predicate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          signer="${GITHUB_REPOSITORY}/.github/workflows/signed-quality-attestation.yml"
          gh attestation verify \
            .cache/knowledge-hub/signed-attestation/quality-evidence-manifest.json \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type https://knowledge-hub.local/attestation/quality/v1 \
            --signer-workflow "${signer}" \
            --signer-digest "${SIGNER_WORKFLOW_REVISION}" \
            --source-ref "${SOURCE_REF}" \
            --deny-self-hosted-runners \
            --format json \
            > .cache/knowledge-hub/signed-attestation/github-verification.json
          rtk python3 -m tools.codex_assets.knowledge_hub.signed_attestation_cli verify-hosted \
            --source-revision "${SOURCE_REVISION}" \
            --source-ref "${SOURCE_REF}" \
            --signer-workflow "${signer}" \
            --signer-source-revision "${SIGNER_WORKFLOW_REVISION}" \
            --verification .cache/knowledge-hub/signed-attestation/github-verification.json \
            --bundle "${BUNDLE_PATH}" \
            --attestation-id "${ATTESTATION_ID}" \
            --attestation-url "${ATTESTATION_URL}"

      - name: Reconcile hosting blocker trackers from fresh signed evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Reaching this step proves a private-repository GitHub-hosted runner
          # executed the exact-source signing workflow and the OIDC attestation
          # verified successfully.
          state100="$(gh issue view 100 --repo "${GITHUB_REPOSITORY}" --json state --jq .state 2>/dev/null || true)"
          if [[ "${state100}" == "OPEN" ]]; then
            gh issue close 100 --repo "${GITHUB_REPOSITORY}" \
              --comment "Fresh exact-source Signed verification executed successfully on a GitHub-hosted private-repository runner; the runner-allocation blocker is closed automatically."
          fi

          protection_status="$(
            rtk python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(
              Path(".cache/knowledge-hub/terminal-closure.json").read_text(
                  encoding="utf-8"
              )
          )
          print(
              str(
                  (payload.get("default_branch_protection") or {}).get(
                      "status", "blocked"
                  )
              )
          )
          PY
          )"
          if [[ "${protection_status}" == "pass" ]]; then
            state95="$(gh issue view 95 --repo "${GITHUB_REPOSITORY}" --json state --jq .state 2>/dev/null || true)"
            if [[ "${state95}" == "OPEN" ]]; then
              gh issue close 95 --repo "${GITHUB_REPOSITORY}" \
                --comment "Fresh signed hosting evidence reports default_branch_protection.status=pass for current master; the protection capability blocker is closed automatically."
            fi
          fi

      - name: Upload signed quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knowledge-hub-signed-quality-${{ env.SOURCE_REVISION }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/knowledge-hub/signed-attestation/
            .cache/knowledge-hub/engineering-quality.json
            .cache/knowledge-hub/compliance-eval.json
            .cache/knowledge-hub/restore-drill-head.json
            .cache/knowledge-hub/final-gate-product-full.json
            .cache/knowledge-hub/quality-evidence-binding.json
            .cache/knowledge-hub/mcp-conformance/
            .cache/knowledge-hub/remote-branch-inventory.json
            .cache/knowledge-hub/hosting-posture.json
            .cache/knowledge-hub/terminal-closure.json
            .tmp/engineering/knowledge-hub.cdx.json
          if-no-files-found: error
          retention-days: 90
