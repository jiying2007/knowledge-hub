name: evidence-ratchet-automerge

on:
  workflow_run:
    workflows:
      - quality
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: evidence-ratchet-automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    name: Merge exact machine evidence ratchet
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'automation/evidence-bind-')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: read
    env:
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}

    steps:
      - name: Resolve protected current master and exact PR
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cache=".cache/knowledge-hub/evidence-ratchet-automerge"
          mkdir -p "${cache}"

          if [[ ! "${HEAD_BRANCH}" =~ ^automation/evidence-bind-[0-9a-f]{12}-[0-9]+$ ]]; then
            echo "machine evidence branch failed deterministic grammar" >&2
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TRIGGER_RUN_ID}" \
            > "${cache}/quality-run.json"
          gh api "repos/${GITHUB_REPOSITORY}" \
            > "${cache}/repository.json"
          gh api "repos/${GITHUB_REPOSITORY}/branches/master" \
            > "${cache}/master.json"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}" \
            > "${cache}/head-commit.json"
          gh api \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=master&head=${GITHUB_REPOSITORY_OWNER}:${HEAD_BRANCH}&per_page=10" \
            > "${cache}/pulls.json"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          cache = Path(".cache/knowledge-hub/evidence-ratchet-automerge")
          run = json.loads((cache / "quality-run.json").read_text(encoding="utf-8"))
          repository = json.loads((cache / "repository.json").read_text(encoding="utf-8"))
          master = json.loads((cache / "master.json").read_text(encoding="utf-8"))
          head_commit = json.loads(
              (cache / "head-commit.json").read_text(encoding="utf-8")
          )
          pulls = json.loads((cache / "pulls.json").read_text(encoding="utf-8"))

          expected_run = {
              "id": int(os.environ["TRIGGER_RUN_ID"]),
              "name": "quality",
              "path": ".github/workflows/quality.yml",
              "event": "pull_request",
              "status": "completed",
              "conclusion": "success",
              "head_branch": os.environ["HEAD_BRANCH"],
              "head_sha": os.environ["HEAD_SHA"],
          }
          for field, value in expected_run.items():
              if run.get(field) != value:
                  raise SystemExit(
                      "trigger Quality mismatch {} expected={!r} observed={!r}".format(
                          field, value, run.get(field)
                      )
                  )
          head_repository = run.get("head_repository") or {}
          if head_repository.get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("trigger Quality head repository mismatch")

          if repository.get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("live repository identity mismatch")
          if repository.get("private") is not True or repository.get("visibility") != "private":
              raise SystemExit("live repository must remain private")

          if master.get("protected") is not True:
              raise SystemExit("master must be protected before machine ratchet auto-merge")
          master_sha = (master.get("commit") or {}).get("sha")
          if not isinstance(master_sha, str) or len(master_sha) != 40:
              raise SystemExit("current master SHA is unavailable")
          if os.environ["WORKFLOW_SHA"] != master_sha:
              raise SystemExit("trusted auto-merge workflow is not bound to current master")

          parents = head_commit.get("parents") or []
          if len(parents) != 1 or (parents[0] or {}).get("sha") != master_sha:
              raise SystemExit("machine evidence head must be a direct child of current master")

          if not isinstance(pulls, list) or len(pulls) != 1:
              raise SystemExit("expected exactly one open machine evidence PR")
          pull = pulls[0]
          if pull.get("draft") is True:
              raise SystemExit("machine evidence PR must not be draft")
          if not str(pull.get("title", "")).startswith(
              "chore(evidence): ratchet machine refs "
          ):
              raise SystemExit("machine evidence PR title is invalid")
          if (pull.get("head") or {}).get("ref") != os.environ["HEAD_BRANCH"]:
              raise SystemExit("machine evidence PR head ref mismatch")
          if (pull.get("head") or {}).get("sha") != os.environ["HEAD_SHA"]:
              raise SystemExit("machine evidence PR head SHA mismatch")
          if ((pull.get("head") or {}).get("repo") or {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("machine evidence PR must be same-repository")
          if (pull.get("base") or {}).get("ref") != "master":
              raise SystemExit("machine evidence PR base must be master")
          if (pull.get("base") or {}).get("sha") != master_sha:
              raise SystemExit("machine evidence PR base SHA is stale")
          if int(pull.get("changed_files", 0) or 0) != 2:
              raise SystemExit("machine evidence PR must change exactly two files")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write("pr_number={}\n".format(int(pull["number"])))
              handle.write("master_sha={}\n".format(master_sha))
          PY

      - name: Checkout exact trusted master verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.master_sha }}
          persist-credentials: false

      - name: Set up governed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-runtime.lock

      - name: Bootstrap governed CI transport
        run: tools/ci/rtk bash tools/ci/bootstrap-path.sh

      - name: Install hash-locked runtime dependencies
        run: rtk python3 -m pip install --require-hashes -r requirements-runtime.lock

      - name: Fetch exact base and head canonical files
        id: origin
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          MASTER_SHA: ${{ steps.resolve.outputs.master_sha }}
        run: |
          set -euo pipefail
          cache=".cache/knowledge-hub/evidence-ratchet-automerge"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            > "${cache}/files.json"
          rtk python3 - <<'PY'
          import json
          from pathlib import Path

          rows = json.loads(
              Path(".cache/knowledge-hub/evidence-ratchet-automerge/files.json").read_text(
                  encoding="utf-8"
              )
          )
          observed = {
              str(row.get("filename", ""))
              for row in rows
              if isinstance(row, dict)
          }
          expected = {
              "registry/items.jsonl",
              "registry/durable-evidence-ledger.jsonl",
          }
          if observed != expected:
              raise SystemExit(
                  "machine evidence PR changed paths outside allowlist: {}".format(
                      sorted(observed)
                  )
              )
          PY

          fetch_file() {
            local ref="$1"
            local path="$2"
            local output="$3"
            gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${ref}" --jq .content \
              | tr -d '\n' | base64 --decode > "${output}"
          }

          fetch_file "${MASTER_SHA}" registry/items.jsonl "${cache}/base-items.jsonl"
          fetch_file "${HEAD_SHA}" registry/items.jsonl "${cache}/head-items.jsonl"
          fetch_file "${MASTER_SHA}" registry/durable-evidence-ledger.jsonl "${cache}/base-ledger.jsonl"
          fetch_file "${HEAD_SHA}" registry/durable-evidence-ledger.jsonl "${cache}/head-ledger.jsonl"

          rtk python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          cache = Path(".cache/knowledge-hub/evidence-ratchet-automerge")
          base = (cache / "base-ledger.jsonl").read_bytes()
          head = (cache / "head-ledger.jsonl").read_bytes()
          if not head.startswith(base):
              raise SystemExit("durable ledger base prefix mismatch")
          tail = [line for line in head[len(base):].splitlines() if line.strip()]
          if len(tail) != 1:
              raise SystemExit("machine evidence PR must append one durable record")
          record = json.loads(tail[0].decode("utf-8"))
          match = re.fullmatch(
              r"evidence-binding-([0-9]+)-([0-9]+)",
              str(record.get("event_id", "")),
          )
          if match is None:
              raise SystemExit("machine evidence origin identity is invalid")
          run_id, attempt = match.groups()
          expected_branch = "automation/evidence-bind-{}-{}".format(
              os.environ["MASTER_SHA"][:12], run_id
          )
          if os.environ["HEAD_BRANCH"] != expected_branch:
              raise SystemExit("machine evidence branch does not match trusted origin run")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write("run_id={}\n".format(run_id))
              handle.write("run_attempt={}\n".format(attempt))
          PY

      - name: Download exact trusted provider artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN_RUN_ID: ${{ steps.origin.outputs.run_id }}
          ORIGIN_RUN_ATTEMPT: ${{ steps.origin.outputs.run_attempt }}
        run: |
          set -euo pipefail
          cache=".cache/knowledge-hub/evidence-ratchet-automerge"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${ORIGIN_RUN_ID}/attempts/${ORIGIN_RUN_ATTEMPT}" \
            > "${cache}/origin-run.json"
          artifact="knowledge-hub-ai-provider-discovery-${ORIGIN_RUN_ID}-${ORIGIN_RUN_ATTEMPT}"
          mkdir -p "${cache}/origin-artifact"
          gh run download "${ORIGIN_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${artifact}" \
            --dir "${cache}/origin-artifact"

      - name: Verify exact machine evidence ratchet
        id: verify
        env:
          MASTER_SHA: ${{ steps.resolve.outputs.master_sha }}
        run: |
          set -euo pipefail
          cache=".cache/knowledge-hub/evidence-ratchet-automerge"
          routing="$(find "${cache}/origin-artifact" -type f -name routing-bundle.json -print -quit)"
          candidate="$(find "${cache}/origin-artifact" -type f -name machine-candidate-items.jsonl -print -quit)"
          manifest="$(find "${cache}/origin-artifact" -type f -name machine-candidate-manifest.json -print -quit)"
          test -n "${routing}"
          test -n "${candidate}"
          test -n "${manifest}"

          ROUTING="${routing}" CANDIDATE="${candidate}" MANIFEST="${manifest}" \
          rtk python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          from tools.codex_assets.knowledge_hub.operator_machine_ratchet_verify import (
              verify_machine_evidence_ratchet,
          )

          cache = Path(".cache/knowledge-hub/evidence-ratchet-automerge")
          result = verify_machine_evidence_ratchet(
              Path(".").resolve(),
              base_items_path=cache / "base-items.jsonl",
              head_items_path=cache / "head-items.jsonl",
              base_ledger_path=cache / "base-ledger.jsonl",
              head_ledger_path=cache / "head-ledger.jsonl",
              routing_path=Path(os.environ["ROUTING"]),
              candidate_path=Path(os.environ["CANDIDATE"]),
              manifest_path=Path(os.environ["MANIFEST"]),
              origin_run_path=cache / "origin-run.json",
              repository=os.environ["GITHUB_REPOSITORY"],
              master_sha=os.environ["MASTER_SHA"],
              head_sha=os.environ["HEAD_SHA"],
          )
          (cache / "verification.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write("candidate_sha256={}\n".format(result["candidate_sha256"]))
          PY

      - name: Revalidate protected current master and merge exact head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          MASTER_SHA: ${{ steps.resolve.outputs.master_sha }}
          CANDIDATE_SHA256: ${{ steps.verify.outputs.candidate_sha256 }}
        run: |
          set -euo pipefail
          cache=".cache/knowledge-hub/evidence-ratchet-automerge"
          gh api "repos/${GITHUB_REPOSITORY}" > "${cache}/repository-before-merge.json"
          gh api "repos/${GITHUB_REPOSITORY}/branches/master" > "${cache}/master-before-merge.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${cache}/pull-before-merge.json"

          private="$(jq -r '.private == true and .visibility == "private"' "${cache}/repository-before-merge.json")"
          protected="$(jq -r '.protected == true' "${cache}/master-before-merge.json")"
          current_master="$(jq -r '.commit.sha' "${cache}/master-before-merge.json")"
          current_head="$(jq -r '.head.sha' "${cache}/pull-before-merge.json")"
          current_base="$(jq -r '.base.sha' "${cache}/pull-before-merge.json")"
          current_title="$(jq -r '.title' "${cache}/pull-before-merge.json")"
          expected_title="chore(evidence): ratchet machine refs ${CANDIDATE_SHA256:0:12} @ ${MASTER_SHA:0:12}"

          if [[ "${private}" != "true" ]]; then
            echo "repository privacy regressed after verification" >&2
            exit 1
          fi
          if [[ "${protected}" != "true" || "${current_master}" != "${MASTER_SHA}" ]]; then
            echo "master protection or source revision changed after verification" >&2
            exit 1
          fi
          if [[ "${current_head}" != "${HEAD_SHA}" || "${current_base}" != "${MASTER_SHA}" ]]; then
            echo "machine evidence PR moved after verification" >&2
            exit 1
          fi
          if [[ "${current_title}" != "${expected_title}" ]]; then
            echo "machine evidence PR title no longer matches verified candidate" >&2
            exit 1
          fi

          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f sha="${HEAD_SHA}" \
            -f merge_method="squash" \
            > "${cache}/merge-result.json"
          test "$(jq -r '.merged == true' "${cache}/merge-result.json")" = "true"

      - name: Retire merged machine evidence branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "${HEAD_BRANCH}" =~ ^automation/evidence-bind-[0-9a-f]{12}-[0-9]+$ ]]; then
            echo "merged machine evidence branch failed grammar" >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${HEAD_BRANCH}" >/dev/null 2>&1; then
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_BRANCH}"
          fi
