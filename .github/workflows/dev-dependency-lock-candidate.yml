name: dev-dependency-lock-candidate

on:
  pull_request:
    paths:
      - requirements-dev.txt
      - requirements-dev.lock
      - pyproject.toml
      - .github/workflows/dev-dependency-lock-candidate.yml

permissions:
  contents: read

jobs:
  candidate:
    name: Generate reproducible dev lock candidate
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.17"
          enable-cache: false

      - name: Generate universal hash-locked candidate
        shell: bash
        run: |
          set -euo pipefail
          uv --version
          uv pip compile requirements-dev.txt \
            --universal --python-version 3.10 --generate-hashes \
            --output-file requirements-dev.lock
          mkdir -p dependency-lock-candidate
          cp requirements-dev.lock dependency-lock-candidate/requirements-dev.lock
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          path = Path("dependency-lock-candidate/requirements-dev.lock")
          payload = path.read_bytes()
          if not 1024 <= len(payload) <= 524288:
              raise SystemExit("unexpected candidate lock byte size")
          text = payload.decode("utf-8")
          if "--hash=sha256:" not in text or "uv pip compile" not in text:
              raise SystemExit("candidate lock lacks hash-generation provenance")
          print("lock_sha256=" + sha256(payload).hexdigest())
          print("lock_size=" + str(len(payload)))
          PY

      - name: Require candidate to match committed lock
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD:requirements-dev.lock > dependency-lock-candidate/committed.lock
          if ! cmp -s dependency-lock-candidate/committed.lock dependency-lock-candidate/requirements-dev.lock; then
            echo "Dev manifest and universal hash-locked requirements-dev.lock are out of sync." >&2
            echo "Download this workflow's candidate artifact and commit its exact requirements-dev.lock." >&2
            exit 1
          fi
          echo "Dev lock matches exact generated candidate."

      - name: Retain exact read-only candidate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-dependency-lock-candidate-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dependency-lock-candidate/requirements-dev.lock
          if-no-files-found: warn
          retention-days: 7
