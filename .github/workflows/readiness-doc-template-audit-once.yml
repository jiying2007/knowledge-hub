name: readiness-doc-template-migration-once

on:
  push:
    branches:
      - codex/readiness-doc-template-drift
    paths:
      - .github/workflows/readiness-doc-template-audit-once.yml

permissions:
  contents: write

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/readiness-doc-template-drift
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply bounded readiness document migration
        run: python tools/ci/readiness_doc_template_drift_once.py
      - name: Verify bounded changed paths
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          projects = json.loads(Path('registry/projects.json').read_text(encoding='utf-8'))['projects']
          expected = {
              'tools/codex_assets/knowledge_hub/project_readiness.py',
              'tests/test_project_readiness.py',
          }
          expected.update(
              str(Path(str(row['validation']).rstrip('/')) / 'project-readiness.md')
              for row in projects
          )
          actual = set(
              subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines()
          )
          if actual != expected:
              raise SystemExit('unexpected changed paths: expected={} actual={}'.format(
                  sorted(expected), sorted(actual)
              ))
          print(json.dumps({'changed_count': len(actual), 'paths': sorted(actual)}, ensure_ascii=False))
          PY
          git diff --check
      - name: Run readiness and evidence regressions
        run: python -m pytest -q tests/test_project_readiness.py tests/test_evidence.py
      - name: Verify canonical readiness idempotence
        run: python -m tools.codex_assets.knowledge_hub.project_readiness_cli --check --as-of 2026-07-13 --json
      - name: Run focused Ruff checks
        run: python -m ruff check tools/codex_assets/knowledge_hub/project_readiness.py tests/test_project_readiness.py
      - name: Commit bounded migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/codex_assets/knowledge_hub/project_readiness.py tests/test_project_readiness.py
          python - <<'PY' > /tmp/readiness-paths.txt
          import json
          from pathlib import Path
          projects = json.loads(Path('registry/projects.json').read_text(encoding='utf-8'))['projects']
          for row in projects:
              print(Path(str(row['validation']).rstrip('/')) / 'project-readiness.md')
          PY
          while IFS= read -r path; do git add -- "$path"; done < /tmp/readiness-paths.txt
          git commit -m 'Eliminate readiness document template drift'
          git push origin HEAD:codex/readiness-doc-template-drift
