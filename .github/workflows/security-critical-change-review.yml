name: security-critical-change-review

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: security-critical-change-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Exact-head security-critical review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}

    steps:
      - name: Checkout exact trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          persist-credentials: false

      - name: Verify workflow is bound to PR base
        run: |
          set -euo pipefail
          if [[ "${WORKFLOW_SHA}" != "${BASE_SHA}" ]]; then
            echo "security review workflow is not bound to the exact PR base" >&2
            exit 1
          fi

      - name: Set up governed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-runtime.lock

      - name: Bootstrap governed CI transport
        run: tools/ci/rtk bash tools/ci/bootstrap-path.sh

      - name: Install hash-locked runtime dependencies
        run: rtk python3 -m pip install --require-hashes -r requirements-runtime.lock

      - name: Fetch exact PR files and reviews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cache=".cache/knowledge-hub/security-change-review"
          mkdir -p "${cache}"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | @json' > "${cache}/files.jsonl"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
            --jq '.[] | @json' > "${cache}/reviews.jsonl"

      - name: Build and validate exact-head security review packet
        id: packet
        run: |
          set -euo pipefail
          rtk python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          from tools.codex_assets.knowledge_hub.common import repository_root
          from tools.codex_assets.knowledge_hub.security_change_review import (
              build_security_change_review,
          )
          from tools.codex_assets.knowledge_hub.schemas import validate_instance

          root = repository_root()
          cache = Path(".cache/knowledge-hub/security-change-review")

          def load_jsonl(path):
              rows = []
              for line in path.read_text(encoding="utf-8").splitlines():
                  if line.strip():
                      rows.append(json.loads(line))
              return rows

          files = load_jsonl(cache / "files.jsonl")
          reviews = load_jsonl(cache / "reviews.jsonl")
          policy = json.loads(
              (root / "registry/review-risk-policy.json").read_text(
                  encoding="utf-8"
              )
          )
          packet = build_security_change_review(
              repository=os.environ["GITHUB_REPOSITORY"],
              pr_number=int(os.environ["PR_NUMBER"]),
              base_sha=os.environ["BASE_SHA"],
              head_sha=os.environ["HEAD_SHA"],
              head_ref=os.environ["HEAD_REF"],
              author_login=os.environ["AUTHOR_LOGIN"],
              same_repository=(
                  os.environ["HEAD_REPOSITORY"]
                  == os.environ["GITHUB_REPOSITORY"]
              ),
              files=files,
              reviews=reviews,
              review_risk_policy=policy,
          )
          validation = validate_instance(
              root,
              "security-change-review-v1",
              packet,
          )
          if validation.get("status") != "pass":
              raise SystemExit(
                  "security change review contract failed: {}".format(
                      validation.get("errors", [])
                  )
              )
          (cache / "packet.json").write_text(
              json.dumps(packet, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a",
              encoding="utf-8",
          ) as handle:
              handle.write(
                  "gate_pass={}\n".format(
                      str(packet["gate_pass"]).lower()
                  )
              )
              handle.write(
                  "security_count={}\n".format(
                      packet["security_critical_file_count"]
                  )
              )
              handle.write(
                  "fingerprint={}\n".format(
                      packet["packet_fingerprint"]
                  )
              )
          if packet["gate_pass"] is not True:
              raise SystemExit(
                  "security-critical exact-head human approval required: "
                  + packet["packet_fingerprint"]
              )
          PY

      - name: Upload bounded security review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knowledge-hub-security-change-review-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/knowledge-hub/security-change-review/packet.json
          if-no-files-found: error
          retention-days: 90
