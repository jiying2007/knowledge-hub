name: digital-worker-source-binding-once

on:
  push:
    branches:
      - codex/digital-worker-source-binding
    paths:
      - .github/workflows/digital-worker-source-binding-once.yml

permissions:
  contents: write

jobs:
  bind-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up representative Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.lock

      - name: Bootstrap governed CI transport
        run: tools/ci/rtk bash tools/ci/bootstrap-path.sh

      - name: Install hash-locked runtime dependencies
        run: rtk python3 -m pip install --require-hashes -r requirements-runtime.lock

      - name: Bind canonical source evidence only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          ITEM_ID = "digital-worker-readiness-validation-20260713"
          SOURCE_REF = "jiying2007/digital-worker@048e1c0460ded66111f29d44a8cab78f09faaef4"
          registry = Path("registry/items.jsonl")
          original = registry.read_text(encoding="utf-8")
          final_newline = original.endswith("\n")
          old_lines = original.splitlines()
          new_lines = []
          matches = 0

          for line in old_lines:
              obj = json.loads(line)
              if obj.get("id") != ITEM_ID:
                  new_lines.append(line)
                  continue
              matches += 1
              contract = obj.get("evidence_contract")
              if not isinstance(contract, dict):
                  raise SystemExit("digital-worker evidence_contract missing or invalid")
              if contract.get("status") != "pending" or contract.get("source_refs") != []:
                  raise SystemExit("digital-worker source precondition changed")
              if contract.get("owner_ref") is not None:
                  raise SystemExit("owner_ref unexpectedly populated")
              if contract.get("validation_refs") != [] or contract.get("artifact_refs") != []:
                  raise SystemExit("validation/artifact evidence unexpectedly populated")
              if contract.get("release_ref") is not None or contract.get("rollback_ref") is not None:
                  raise SystemExit("release/rollback evidence unexpectedly populated")
              contract["source_refs"] = [{"kind": "source-commit", "ref": SOURCE_REF}]
              new_lines.append(json.dumps(obj, ensure_ascii=False, separators=(",", ":")))

          if matches != 1:
              raise SystemExit(f"expected one target item, found {matches}")
          if len(new_lines) != len(old_lines):
              raise SystemExit("registry line count changed")
          for old, new in zip(old_lines, new_lines):
              if json.loads(old).get("id") != ITEM_ID and old != new:
                  raise SystemExit("non-target registry line changed")
          registry.write_text("\n".join(new_lines) + ("\n" if final_newline else ""), encoding="utf-8")
          PY
          test "$(git diff --name-only)" = "registry/items.jsonl"
          git diff --check

      - name: Validate source-only patch
        shell: bash
        run: |
          set -euo pipefail
          rtk bash tools/knowledge-check.sh --dry-run --json --diagnostics >/tmp/knowledge-check.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/knowledge-check.json").read_text(encoding="utf-8"))
          if payload.get("status") != "pass":
              raise SystemExit(f"knowledge-check status={payload.get('status')!r}")
          print("knowledge-check=pass")
          PY

      - name: Commit and publish source-only candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(git diff --name-only)" = "registry/items.jsonl"
          git add registry/items.jsonl
          git diff --cached --check
          git commit -m "docs: bind digital-worker canonical source evidence"
          test -z "$(git status --porcelain)"
          git push origin HEAD:codex/digital-worker-source-binding
