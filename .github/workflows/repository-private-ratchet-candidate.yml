name: repository-private-ratchet-candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: repository-private-ratchet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Verify private hosting and emit reviewable machine candidate
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout immutable candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up governed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Bootstrap governed CI transport
        run: tools/ci/rtk bash tools/ci/bootstrap-path.sh
      - name: Install hash-locked dependencies
        run: rtk python3 -m pip install --require-hashes -r requirements-dev.lock
      - name: Capture authoritative GitHub repository metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/knowledge-hub/repository-private-ratchet
          gh api "repos/${GITHUB_REPOSITORY}" > .cache/knowledge-hub/repository-private-ratchet/repository-metadata.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > .cache/knowledge-hub/repository-private-ratchet/source-run.json
      - name: Build non-canonical private-boundary candidate
        run: |
          set -euo pipefail
          observed_at="$(jq -er '.run_started_at // .created_at' .cache/knowledge-hub/repository-private-ratchet/source-run.json)"
          rtk python3 -m tools.codex_assets.knowledge_hub.repository_private_ratchet_cli \
            --repository-metadata .cache/knowledge-hub/repository-private-ratchet/repository-metadata.json \
            --expected-repository "${GITHUB_REPOSITORY}" \
            --source-revision "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --observed-at "${observed_at}" \
            --candidate-output .cache/knowledge-hub/repository-private-ratchet/candidate-registry.json \
            --proposal-output .cache/knowledge-hub/repository-private-ratchet/ratchet-proposal.json
      - name: Prove canonical registry remains untouched
        run: |
          set -euo pipefail
          git diff --exit-code -- registry/knowledge-platform-p5-p10.json
      - name: Upload bounded machine-ratchet candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knowledge-hub-repository-private-ratchet-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/knowledge-hub/repository-private-ratchet/repository-metadata.json
            .cache/knowledge-hub/repository-private-ratchet/source-run.json
            .cache/knowledge-hub/repository-private-ratchet/candidate-registry.json
            .cache/knowledge-hub/repository-private-ratchet/ratchet-proposal.json
          if-no-files-found: error
          retention-days: 90
