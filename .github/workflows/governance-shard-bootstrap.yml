name: governance-shard-bootstrap

on:
  push:
    branches:
      - codex/legacy-burndown-governance-v1

permissions:
  contents: write

jobs:
  shard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Deterministically shard generated governance cases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path

          root = Path('.')
          regression = root / 'tools/codex_assets/knowledge_hub/regression'
          source_path = regression / 'governance.py'
          source = source_path.read_text(encoding='utf-8')
          tree = ast.parse(source)
          lines = source.splitlines(keepends=True)
          blocks = []
          unexpected = []
          for node in tree.body:
              if isinstance(node, ast.Expr) and isinstance(node.value, ast.Constant) and isinstance(node.value.value, str):
                  continue
              if isinstance(node, ast.ImportFrom) and node.level == 1 and node.module == 'support':
                  continue
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name.startswith('test_'):
                  if node.end_lineno is None:
                      raise RuntimeError('function missing end_lineno: ' + node.name)
                  blocks.append((node.name, ''.join(lines[node.lineno - 1:node.end_lineno]).rstrip()))
                  continue
              unexpected.append('{}:{}'.format(type(node).__name__, getattr(node, 'name', '')))
          if unexpected:
              raise RuntimeError('unexpected governance top-level nodes; refusing lossy migration: {!r}'.format(unexpected))
          if len(blocks) < 4:
              raise RuntimeError('not enough governance tests to shard')

          def line_count(block):
              return block.count('\n') + 1

          total = sum(line_count(block) for _, block in blocks)
          cut_indexes = []
          start = 0
          for part in range(1, 4):
              target = total * part / 4.0
              prefix = sum(line_count(block) for _, block in blocks[:start])
              best_index = start + 1
              best_delta = float('inf')
              for index in range(start + 1, len(blocks) - (4 - part) + 1):
                  candidate = prefix + sum(line_count(block) for _, block in blocks[start:index])
                  delta = abs(candidate - target)
                  if delta < best_delta:
                      best_index = index
                      best_delta = delta
                  if candidate >= target and delta > best_delta:
                      break
              cut_indexes.append(best_index)
              start = best_index

          indexes = [0] + cut_indexes + [len(blocks)]
          partitions = [blocks[indexes[i]:indexes[i + 1]] for i in range(4)]
          module_names = ('governance', 'governance_2', 'governance_3', 'governance_4')

          def render(name, part):
              title = name.replace('_', ' ')
              header = (
                  f'"""Generated regression cases: {title}."""\n\n'
                  '# Generated by regression_codegen.py; edit assertions here, then keep the generator deterministic.\n'
                  'from .support import *  # noqa: F401,F403\n\n'
              )
              body = '\n\n'.join(block for _, block in part)
              return header + body + ('\n' if body else '')

          rendered = {name: render(name, part) for name, part in zip(module_names, partitions)}
          before_names = [name for name, _ in blocks]
          after_names = [name for part in partitions for name, _ in part]
          if after_names != before_names or len(after_names) != len(set(after_names)):
              raise RuntimeError('governance test identity/order changed')
          sizes = {name: len(text.splitlines()) for name, text in rendered.items()}
          if max(sizes.values()) > 800:
              raise RuntimeError('governance shard exceeds 800 lines: {!r}'.format(sizes))

          for name, text in rendered.items():
              (regression / f'{name}.py').write_text(text, encoding='utf-8')

          runner_path = regression / 'runner.py'
          runner = runner_path.read_text(encoding='utf-8')
          marker = 'from .governance import *  # noqa: F401,F403,E402\n'
          replacement = marker + ''.join(
              f'from .{name} import *  # noqa: F401,F403,E402\n'
              for name in module_names[1:]
          )
          if marker not in runner:
              raise RuntimeError('runner governance import marker missing')
          runner_path.write_text(runner.replace(marker, replacement, 1), encoding='utf-8')

          print('governance tests:', len(before_names))
          print('shard sizes:', sizes)
          PY
          rm .github/workflows/governance-shard-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/codex_assets/knowledge_hub/regression/governance*.py tools/codex_assets/knowledge_hub/regression/runner.py .github/workflows/governance-shard-bootstrap.yml
          git diff --cached --check
          git commit -m 'refactor(regression): shard governance cases deterministically'
          git push origin HEAD:codex/legacy-burndown-governance-v1
