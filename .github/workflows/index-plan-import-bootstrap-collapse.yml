name: Index Plan Import Bootstrap Collapse

on:
  push:
    branches:
      - codex/legacy-burndown-index-plan-v1

permissions:
  contents: write

jobs:
  collapse:
    if: "${{ !contains(github.event.head_commit.message, 'refactor(index-plan): collapse import bootstrap') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Bootstrap governed CI transport
        run: tools/ci/rtk bash tools/ci/bootstrap-path.sh
      - name: Install hash-locked dependencies
        run: rtk python3 -m pip install --require-hashes -r requirements-dev.lock
      - name: Collapse import bootstrap and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/codex_assets/knowledge_hub/index_plan_cli.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('if __package__:\n')
          end = text.index('\nINDEX_PLAN_FULL_JSON_MAX_BYTES', start)
          replacement_lines = [
              'if not __package__:',
              '    repository_root = pathlib.Path(__file__).resolve().parents[3]',
              '    if str(repository_root) not in sys.path:',
              '        sys.path.insert(0, str(repository_root))',
              '',
              'from tools.codex_assets.knowledge_hub.index_plan_linking import build_linking_audit',
              'from tools.codex_assets.knowledge_hub.index_plan_manifest import classify_unpaired_manifest, manifest_profile_health',
              'from tools.codex_assets.knowledge_hub.index_plan_review_forms import apply_review_queue_filters, configure_review_forms, validate_review_queue_forms',
              'from tools.codex_assets.knowledge_hub.index_plan_review_queue import (',
              '    build_review_queue_view,',
              '    configure_review_queue,',
              '    first_present_field,',
              '    make_review_queue_form,',
              ')',
              'from tools.codex_assets.knowledge_hub.index_plan_support import (',
              '    display_path,',
              '    emit_json,',
              '    is_local_manifest_draft,',
              '    read_json_array,',
              '    read_jsonl,',
              '    repository_file_sha256,',
              '    select_source_coverage_closeout,',
              ')',
          ]
          replacement = '\n'.join(replacement_lines) + '\n'
          new_text = text[:start] + replacement + text[end + 1:]
          path.write_text(new_text, encoding='utf-8')
          PY

          rtk python3 -m compileall -q tools/codex_assets/knowledge_hub/index_plan_*.py
          rtk python3 -m ruff check tools/codex_assets/knowledge_hub/index_plan_cli.py tools/codex_assets/knowledge_hub/index_plan_support.py tools/codex_assets/knowledge_hub/index_plan_review_queue.py tools/codex_assets/knowledge_hub/index_plan_review_forms.py tools/codex_assets/knowledge_hub/index_plan_manifest.py tools/codex_assets/knowledge_hub/index_plan_linking.py
          rtk python3 -m mypy tools/codex_assets/knowledge_hub/index_plan_cli.py tools/codex_assets/knowledge_hub/index_plan_support.py tools/codex_assets/knowledge_hub/index_plan_review_queue.py tools/codex_assets/knowledge_hub/index_plan_review_forms.py tools/codex_assets/knowledge_hub/index_plan_manifest.py tools/codex_assets/knowledge_hub/index_plan_linking.py

          rtk python3 tools/codex_assets/knowledge_hub/index_plan_cli.py . --section status --json --as-of 2026-09-13 > /tmp/index-plan-direct.json
          rtk python3 -m tools.codex_assets.knowledge_hub.index_plan_cli . --section status --json --as-of 2026-09-13 > /tmp/index-plan-module.json
          rtk bash tools/knowledge-index-plan.sh --section status --json --as-of 2026-09-13 > /tmp/index-plan-wrapper.json
          cmp /tmp/index-plan-direct.json /tmp/index-plan-module.json
          cmp /tmp/index-plan-direct.json /tmp/index-plan-wrapper.json

          rtk python3 -m pytest -q tests/test_review_queue_sla.py tests/test_cli_help.py tests/test_complexity_budget.py
          rtk python3 - <<'PY'
          from pathlib import Path
          from tools.codex_assets.knowledge_hub.common import repository_root
          from tools.codex_assets.knowledge_hub.complexity_budget import evaluate_complexity_budget

          root = repository_root()
          target = Path('tools/codex_assets/knowledge_hub/index_plan_cli.py')
          lines = len(target.read_text(encoding='utf-8').splitlines())
          print(f'index_plan_cli_lines={lines}')
          if lines > 800:
              raise SystemExit(f'index_plan_cli.py still exceeds 800 lines: {lines}')
          report = evaluate_complexity_budget(root)
          print(f'oversized_module_count={report["oversized_module_count"]}')
          print(f'oversized_paths={[row["path"] for row in report["oversized_modules"]]}')
          print(f'regressions={report["regressions"]}')
          if report['status'] != 'pass':
              raise SystemExit('complexity budget status is not pass')
          if report['oversized_module_count'] != 2:
              raise SystemExit(f'expected exactly 2 oversized modules, got {report["oversized_module_count"]}')
          if report['regressions']:
              raise SystemExit(f'unexpected complexity regressions: {report["regressions"]}')
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/codex_assets/knowledge_hub/index_plan_cli.py
          git commit -m 'refactor(index-plan): collapse import bootstrap'
          git push origin HEAD:codex/legacy-burndown-index-plan-v1
