[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-hub-tools"
version = "2.0.0"
description = "Local-first Knowledge Hub tooling"
dependencies = [
    "PyYAML==6.0.3",
    "jsonschema==4.23.0",
    "tomli==2.4.1; python_version < '3.11'",
]

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-config --strict-markers"

[tool.ruff]
target-version = "py38"
line-length = 120
extend-exclude = [".cache", ".tmp", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tools/codex_assets/knowledge_hub/regression/*.py" = ["F403", "F405"]
# runtime_v3 is the stable compatibility facade that intentionally re-exports
# selected contract/governance helpers from the split implementation modules.
"tools/codex_assets/knowledge_hub/runtime_v3.py" = ["F401"]

[tool.mypy]
# mypy 2.3 no longer accepts a Python 3.8 parser target. Runtime support for
# 3.8/3.9 remains independently enforced by the system-Python CI jobs; this
# value is only the static-analysis language floor accepted by the pinned mypy.
python_version = "3.10"
files = [
    "tools/codex_assets/knowledge_hub/activity.py",
    "tools/codex_assets/knowledge_hub/common.py",
    "tools/codex_assets/knowledge_hub/agent_runtime.py",
    "tools/codex_assets/knowledge_hub/engineering.py",
    "tools/codex_assets/knowledge_hub/export.py",
    "tools/codex_assets/knowledge_hub/health.py",
    "tools/codex_assets/knowledge_hub/lifecycle.py",
    "tools/codex_assets/knowledge_hub/link_audit.py",
    "tools/codex_assets/knowledge_hub/metrics.py",
    "tools/codex_assets/knowledge_hub/metrics_cli.py",
    "tools/codex_assets/knowledge_hub/model.py",
    "tools/codex_assets/knowledge_hub/obsidian_view.py",
    "tools/codex_assets/knowledge_hub/product_gate.py",
    "tools/codex_assets/knowledge_hub/product_gate_support.py",
    "tools/codex_assets/knowledge_hub/product_gate_parallel.py",
    "tools/codex_assets/knowledge_hub/product_policy.py",
    "tools/codex_assets/knowledge_hub/recovery_cli.py",
    "tools/codex_assets/knowledge_hub/retrieval.py",
    "tools/codex_assets/knowledge_hub/restore.py",
    "tools/codex_assets/knowledge_hub/runtime_maintenance.py",
    "tools/codex_assets/knowledge_hub/runtime_v3_contracts.py",
    "tools/codex_assets/knowledge_hub/runtime_v3_governance.py",
    "tools/codex_assets/knowledge_hub/runtime_v3.py",
    "tools/codex_assets/knowledge_hub/runtime_p4_interop.py",
    "tools/codex_assets/knowledge_hub/runtime_p4_policy.py",
    "tools/codex_assets/knowledge_hub/runtime_p4_cli.py",
    "tools/codex_assets/knowledge_hub/runtime_v3_cli.py",
    "tools/codex_assets/knowledge_hub/mcp_v3_server.py",
    "tools/codex_assets/knowledge_hub/search.py",
    "tools/codex_assets/knowledge_hub/search_core.py",
    "tools/codex_assets/knowledge_hub/search_index.py",
    "tools/codex_assets/knowledge_hub/search_query_support.py",
    "tools/codex_assets/knowledge_hub/search_query.py",
    "tools/codex_assets/knowledge_hub/search_cli.py",
    "tools/codex_assets/knowledge_hub/source_runtime.py",
    "tools/codex_assets/knowledge_hub/status_common.py",
    "tools/codex_assets/knowledge_hub/status_owner_projection.py",
    "tools/codex_assets/knowledge_hub/status_product_audit.py",
    "tools/codex_assets/knowledge_hub/status_result.py",
    "tools/codex_assets/knowledge_hub/status_review.py",
    "tools/codex_assets/knowledge_hub/runtime_p5_security.py",
    "tools/codex_assets/knowledge_hub/protocol_conformance.py",
    "tools/codex_assets/knowledge_hub/retrieval_v4.py",
    "tools/codex_assets/knowledge_hub/eval_v2.py",
    "tools/codex_assets/knowledge_hub/memory_runtime.py",
    "tools/codex_assets/knowledge_hub/temporal_graph.py",
    "tools/codex_assets/knowledge_hub/connector_runtime.py",
    "tools/codex_assets/knowledge_hub/connector_adapters.py",
    "tools/codex_assets/knowledge_hub/observability_runtime.py",
    "tools/codex_assets/knowledge_hub/attestation.py",
    "tools/codex_assets/knowledge_hub/engineering_debt.py",
    "tools/codex_assets/knowledge_hub/runtime_p5_p10_cli.py",
    "tools/codex_assets/knowledge_hub/complexity_budget.py",
    "tools/codex_assets/knowledge_hub/regression_codegen.py",
    "tools/codex_assets/knowledge_hub/terminal_closure.py",
    "tools/codex_assets/knowledge_hub/remote_branch_inventory.py",
    "tools/codex_assets/knowledge_hub/context.py",
    "tools/codex_assets/knowledge_hub/context_support.py",
    "tools/codex_assets/knowledge_hub/context_assembly.py",
]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
follow_imports = "skip"

[tool.coverage.run]
branch = false
source = ["tools.codex_assets.knowledge_hub"]
data_file = ".tmp/engineering/.coverage"
parallel = true
relative_files = true
patch = ["subprocess"]
omit = ["*/tools/codex_assets/knowledge_hub/regression_fixture_cli.py"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
omit = ["*/tools/codex_assets/knowledge_hub/regression_fixture_cli.py"]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests", ".cache", ".tmp"]
